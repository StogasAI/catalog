# The Message Batches API runs Messages requests within 24 hours at half of every token price,
# and server tools keep their own prices
# (https://platform.claude.com/docs/en/build-with-claude/batch-processing and
# https://platform.claude.com/docs/en/about-claude/pricing#batch-processing). Batch requests
# cannot stream or use Fast mode. Results stay available for 29 days, outside zero data
# retention, so each batch deployment keeps them for at least 29 days in an unknown place.
routes:
  providerId: anthropic
  endpoint: https://api.anthropic.com/v1/messages/batches
  interfaces: [chat_completions, responses]
  batch: true
  inputModalities: [text, image]
  # Native document formats reviewed 2026-10-05: https://platform.claude.com/docs/en/build-with-claude/files
  documentFormats:
    extensions: [.csv, .md, .pdf, .txt]
    mediaTypes: [application/pdf, text/plain]
  dataHandling:
    endToEndEncrypted: false
  # Prices reviewed 2026-10-11: https://platform.claude.com/docs/en/about-claude/pricing
  # Data handling reviewed 2026-11-03: https://platform.claude.com/docs/en/manage-claude/api-and-data-retention
  # and https://platform.claude.com/docs/en/manage-claude/data-residency. inference_geo covers model inference
  # only, so a search or a fetch can run anywhere. Website publishers can keep the URLs that web fetch requests.
  hostedTools:
    - tool: web_search
      pricing:
        anthropic_web_search_calls:
          per_1k_calls: '10'
      dataHandling:
        processingLocation: unknown
    - tool: web_fetch
      dataHandling:
        processingLocation: unknown
        storageLocation: unknown
        retentionDays: null
        zeroDataRetention: false
  overrides:
    capabilities:
      streaming: false
  stogasUnsupported: The gateway answers each request as it arrives and has no batch API.
