routes:
  providerId: anthropic
  endpoint: https://api.anthropic.com/v1/messages
  interfaces: [chat_completions, responses]
  inputModalities: [text, image]
  capabilities:
    streaming: true
    functionCalling: true
    parallelFunctionCalling: true
    implicitPromptCaching: false
    explicitPromptCaching: true
    structuredOutputs: true
    systemMessages: true
    toolChoice: true
  # The sampling fields of the Messages API. Reviewed 2026-11-15:
  # https://platform.claude.com/docs/en/api/messages/create
  sampling:
    temperature: true
    topP: true
    topK: true
    frequencyPenalty: false
    presencePenalty: false
    repetitionPenalty: false
    seed: false
    logitBias: false
  # Anthropic states the image limit as 10 MB of base64 text.
  # Reviewed 2026-11-15: https://platform.claude.com/docs/en/api/overview#request-size-limits,
  # https://platform.claude.com/docs/en/build-with-claude/vision#request-limits and
  # https://platform.claude.com/docs/en/build-with-claude/pdf-support
  inputLimits:
    requestBytes: 128000000
    images:
      count: 600
      bytes: 7500000
      pixels: 8000
    documents:
      pages: 600
  # Native document formats reviewed 2026-10-05: https://platform.claude.com/docs/en/build-with-claude/files
  documentFormats:
    extensions: [.csv, .md, .pdf, .txt]
    mediaTypes: [application/pdf, text/plain]
  # Prices reviewed 2026-10-11: https://platform.claude.com/docs/en/about-claude/pricing
  # Data handling reviewed 2026-11-03: https://platform.claude.com/docs/en/manage-claude/api-and-data-retention
  # and https://platform.claude.com/docs/en/manage-claude/data-residency. inference_geo covers model inference
  # only, so a search or a fetch can run anywhere. Website publishers can keep the URLs that web fetch requests.
  hostedTools:
    - tool: web_search
      pricing:
        anthropic_web_search_calls:
          per_1k_calls: '10'
      dataHandling:
        processingLocation: unknown
    - tool: web_fetch
      dataHandling:
        processingLocation: unknown
        storageLocation: unknown
        retentionDays: null
        zeroDataRetention: false
        sharedWith: [unknown]
