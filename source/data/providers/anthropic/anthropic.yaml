providers:
  name: Anthropic
  stogasByok: true
  companyId: anthropic
  # Under a zero data retention arrangement Anthropic stores no prompt or response of the Messages
  # API once it has returned the response. The Batch API is outside the arrangement, and the Fable
  # and Mythos models keep their 30 days (minimumRetentionDays). An organization that has signed
  # the business associate agreement and enabled HIPAA readiness may send protected health
  # information through the Messages API. Anthropic's API reports neither.
  # Reviewed 2026-11-19: https://platform.claude.com/docs/en/manage-claude/api-and-data-retention
  accountOptions:
    - id: zero-data-retention
      name: Zero data retention
      routes: [anthropic-messages]
      dataHandling:
        storageLocation: none
        retentionDays: 0
        zeroDataRetention: true
    - id: business-associate-agreement
      name: Business associate agreement
      routes: [anthropic-messages]
      grants: [hipaa]
  # Anthropic deletes API inputs and outputs within 30 days, names no place where it stores them,
  # and keeps content that its safety systems flag for up to 2 years. Its API retention page also
  # says that content is not retained by default, so 30 days is the most that either page allows.
  # Reviewed 2026-11-09: https://privacy.claude.com/en/articles/7996866-how-long-do-you-store-my-organization-s-data
  # and https://platform.claude.com/docs/en/manage-claude/api-and-data-retention
  # Anthropic lists the audits of its commercial products, which name the Anthropic API, and signs a
  # business associate agreement for the API. Certifications reviewed 2026-11-17:
  # https://support.claude.com/en/articles/10015870 and
  # https://privacy.claude.com/en/articles/8114513-business-associate-agreements-baa-for-commercial-customers
  dataHandling:
    processingLocation: world
    storageLocation: unknown
    retentionDays: 30
    trainingUse: false
    # Organizations never share prompt caches, and the Claude API also keeps them apart between
    # workspaces. Reviewed 2026-11-19: https://platform.claude.com/docs/en/build-with-claude/prompt-caching
    isolatedPromptCache: true
    certifications: [soc2-type2, iso-27001, iso-42001, hipaa-eligible]
