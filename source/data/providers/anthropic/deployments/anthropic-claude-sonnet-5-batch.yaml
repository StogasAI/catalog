deployments:
  modelId: claude-sonnet-5
  routeIds: [anthropic-message-batches]
  hosting: anthropic
  upstream:
    model: claude-sonnet-5
    inferenceGeo: global
  overrides:
    dataHandling:
      retentionDays: 29
  pricing:
    input_tokens:
      per_mill_tokens: '1'
    cached_input_tokens:
      per_mill_tokens: '0.1'
    cache_write_5m_input_tokens:
      per_mill_tokens: '1.25'
    cache_write_1h_input_tokens:
      per_mill_tokens: '2'
    output_tokens:
      per_mill_tokens: '5'
