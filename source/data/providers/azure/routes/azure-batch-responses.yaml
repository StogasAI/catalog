# Azure runs a file of Responses requests on a Global Batch or Data Zone Batch deployment at its
# batch prices and aims to finish within 24 hours
# (https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/batch). Batch requests cannot
# stream, and Microsoft documents text and image input for them. Azure keeps batch input and
# output files until they are deleted unless the request sets an expiry of 14 to 30 days, so the
# route states unknown retention.
routes:
  providerId: azure
  interfaces: [responses]
  batch: true
  inputModalities: [text, image]
  capabilities:
    streaming: false
    functionCalling: true
    parallelFunctionCalling: true
    implicitPromptCaching: true
    explicitPromptCaching: true
    structuredOutputs: true
    systemMessages: true
    toolChoice: true
  # The sampling fields of Azure's Chat Completions API, which are OpenAI's. Reviewed 2026-11-15:
  # https://learn.microsoft.com/en-us/azure/ai-foundry/openai/reference
  # Responses has no seed and no logit_bias.
  sampling:
    temperature: true
    topP: true
    topK: false
    frequencyPenalty: true
    presencePenalty: true
    repetitionPenalty: false
    seed: false
    logitBias: false
  dataHandling:
    retentionDays: null
