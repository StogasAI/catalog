deployments:
  modelId: deepseek-v3.2
  routeIds: [azure-chat-completions]
  upstream:
    model: DeepSeek-V3.2
    modelFormat: DeepSeek
    modelVersion: '1'
    hosting: azure
    deploymentType: global_standard
  overrides:
    contextWindowTokens: 128000
    maxOutputTokens: 128000
    capabilities:
      functionCalling: false
      parallelFunctionCalling: false
      implicitPromptCaching: false
      structuredOutputs: false
      toolChoice: false
  pricing:
    input_tokens:
      per_mill_tokens: '0.58'
    cached_input_tokens:
      per_mill_tokens: '0.58'
    output_tokens:
      per_mill_tokens: '1.68'
