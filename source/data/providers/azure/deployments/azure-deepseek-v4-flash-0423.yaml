deployments:
  modelId: deepseek-v4-flash-0423
  routeIds: [azure-chat-completions]
  upstream:
    model: DeepSeek-V4-Flash
    modelFormat: DeepSeek
    modelVersion: '2026-04-23'
    deploymentType: global_standard
  # Microsoft lists the retirement date, 1,000,000 input tokens and 384,000 output tokens.
  # Reviewed 2026-11-09: https://learn.microsoft.com/en-us/azure/foundry/foundry-models/concepts/models-sold-directly-by-azure#deepseek-models-sold-by-azure
  retirementDate: 2028-02-20
  overrides:
    contextWindowTokens: 1000000
    maxOutputTokens: 384000
    # Probed 2026-10-14: several tool calls per turn, even with parallel_tool_calls false, and json_schema output holds.
    capabilities:
      explicitPromptCaching: false
      # The model calls the tool or writes the call into its text under tool_choice none (capture
      # azure/other-model-formats-tool-choice-none).
      toolChoiceNone: false
  pricing:
    input_tokens:
      per_mill_tokens: '0.19'
    cached_input_tokens:
      per_mill_tokens: '0.028'
    output_tokens:
      per_mill_tokens: '0.51'
