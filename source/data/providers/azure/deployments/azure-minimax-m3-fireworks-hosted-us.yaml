deployments:
  modelId: minimax-m3
  routeIds: [azure-chat-completions]
  hosting: fireworks
  upstream:
    model: FW-MiniMax-M3
    modelFormat: Fireworks
    modelVersion: '1'
    deploymentType: data_zone_standard_us
  # Microsoft's US Data Zone processes requests only in the US. Reviewed 2026-11-09:
  # https://learn.microsoft.com/en-us/azure/foundry/foundry-models/concepts/deployment-types and
  # https://learn.microsoft.com/en-us/azure/foundry/how-to/fireworks/enable-fireworks-models
  overrides:
    capabilities:
      parallelFunctionCalling: false
      explicitPromptCaching: false
      structuredOutputs: false
    dataHandling:
      processingLocation: US
      # Fireworks AI runs the model, and Microsoft names no audit of it for this deployment.
      certifications: []
      retentionDays: null
      trainingUse: null
  pricing:
    input_tokens:
      per_mill_tokens: '0.33'
    cached_input_tokens:
      per_mill_tokens: '0.066'
    output_tokens:
      per_mill_tokens: '1.32'
