deployments:
  modelId: claude-sonnet-5-5
  routeIds: [azure-anthropic-messages]
  upstream:
    model: claude-sonnet-5-5
    modelFormat: Anthropic
    modelVersion: '2'
    deploymentType: global_standard
  retirementDate: 2027-09-29
  # Anthropic operates Claude on Azure's systems as an independent data processor, under its own
  # retention terms. Reviewed 2026-11-16:
  # https://learn.microsoft.com/en-us/azure/foundry/foundry-models/concepts/claude-models-hosting-comparison
  # and https://platform.claude.com/docs/en/manage-claude/api-and-data-retention
  overrides:
    dataHandling:
      retentionDays: 30
      sharedWith: [anthropic]
  pricing:
    input_tokens:
      per_mill_tokens: '2'
    cached_input_tokens:
      per_mill_tokens: '0.1'
    cache_write_5m_input_tokens:
      per_mill_tokens: '2.5'
    cache_write_1h_input_tokens:
      per_mill_tokens: '4'
    output_tokens:
      per_mill_tokens: '10'
