deployments:
  modelId: gpt-5.5-2026-04-23
  routeIds: [azure-chat-completions, azure-responses]
  upstream:
    model: gpt-5.5
    modelFormat: OpenAI
    modelVersion: '2026-04-24'
    deploymentType: data_zone_standard_us
    serviceTier: fast
  retirementDate: 2027-10-26
  overrides:
    # Azure caches prompts of 1,024 tokens or more on every OpenAI model. Reviewed 2026-11-15:
    # https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/prompt-caching
    promptCacheMinimumTokens: 1024
    # Microsoft publishes Priority meters for GPT-5.5 prompts up to 272,000 tokens only.
    contextWindowTokens: 272000
  pricing:
    input_tokens:
      per_mill_tokens: '13.75'
    cached_input_tokens:
      per_mill_tokens: '1.375'
    output_tokens:
      per_mill_tokens: '82.5'
