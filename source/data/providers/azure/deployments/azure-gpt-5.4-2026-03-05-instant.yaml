deployments:
  modelId: gpt-5.4-2026-03-05
  routeIds: [azure-chat-completions, azure-responses]
  upstream:
    model: gpt-5.4
    modelFormat: OpenAI
    modelVersion: '2026-03-05'
    deploymentType: instant
  retirementDate: 2027-09-02
  overrides:
    # Microsoft's preview terms can differ on abuse monitoring, so the option does not reach it.
    accountOptions:
      modified-abuse-monitoring: false
    # Azure caches prompts of 1,024 tokens or more on every OpenAI model. Reviewed 2026-11-15:
    # https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/prompt-caching
    promptCacheMinimumTokens: 1024
  pricing:
    input_tokens:
      per_mill_tokens: '2.5'
      per_mill_context_gt_272k: '5'
    cached_input_tokens:
      per_mill_tokens: '0.25'
      per_mill_context_gt_272k: '0.5'
    output_tokens:
      per_mill_tokens: '15'
      per_mill_context_gt_272k: '22.5'
