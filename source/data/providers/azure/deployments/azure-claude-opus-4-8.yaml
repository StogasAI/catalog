deployments:
  modelId: claude-opus-4-8
  routeIds: [azure-anthropic-messages]
  upstream:
    model: claude-opus-4-8
    modelFormat: Anthropic
    modelVersion: '2'
    deploymentType: global_standard
  retirementDate: 2027-09-01
  # Anthropic operates Claude on Azure's systems as an independent data processor. Reviewed 2026-11-16:
  # https://learn.microsoft.com/en-us/azure/foundry/foundry-models/concepts/claude-models-hosting-comparison
  overrides:
    dataHandling:
      sharedWith: [anthropic]
  pricing:
    input_tokens:
      per_mill_tokens: '5'
    cached_input_tokens:
      per_mill_tokens: '0.5'
    cache_write_5m_input_tokens:
      per_mill_tokens: '6.25'
    cache_write_1h_input_tokens:
      per_mill_tokens: '10'
    output_tokens:
      per_mill_tokens: '25'
