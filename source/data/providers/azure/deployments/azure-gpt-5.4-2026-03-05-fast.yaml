deployments:
  modelId: gpt-5.4-2026-03-05
  routeIds: [azure-chat-completions, azure-responses]
  upstream:
    model: gpt-5.4
    modelFormat: OpenAI
    modelVersion: '2026-03-05'
    deploymentType: global_standard
    serviceTier: fast
  retirementDate: 2027-09-02
  overrides:
    # Azure caches prompts of 1,024 tokens or more on every OpenAI model. Reviewed 2026-11-15:
    # https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/prompt-caching
    promptCacheMinimumTokens: 1024
    # Microsoft publishes Priority meters for GPT-5.4 prompts up to 272,000 tokens only.
    contextWindowTokens: 272000
  pricing:
    input_tokens:
      per_mill_tokens: '5'
    cached_input_tokens:
      per_mill_tokens: '0.5'
    output_tokens:
      per_mill_tokens: '30'
