providers:
  name: Azure
  stogasByok: true
  companyId: microsoft
  # A resource keeps data at rest in its Azure geography, so a credential's binding narrows storage
  # to the geography of its resource. These are the geographies that offer Foundry models.
  accountLocations:
    - AE
    - AT
    - AU
    - BE
    - BR
    - CA
    - CH
    - CL
    - DE
    - DK
    - ES
    - FI
    - FR
    - GB
    - ID
    - IL
    - IN
    - IT
    - JP
    - KR
    - MX
    - MY
    - NO
    - NZ
    - PL
    - QA
    - SA
    - SE
    - SG
    - TW
    - US
    - ZA
    - apac
    - europe
  # Appendix A of Microsoft Azure Compliance Offerings (October 2026) lists "Microsoft Foundry:
  # Foundry Models" in the scope of every audit below and of the HIPAA business associate agreement,
  # and limits that to Foundry Models sold by Azure: Azure OpenAI models and the other models that
  # Azure hosts and operates. A model that another company runs states its own list. Microsoft's
  # FedRAMP High authorization covers United States regions only.
  # Certifications reviewed 2026-11-17: https://aka.ms/AzureCompliance and
  # https://azure.microsoft.com/en-us/blog/microsoft-azure-ai-foundry-models-and-microsoft-security-copilot-achieve-iso-iec-420012023-certification/
  dataHandling:
    processingLocation: world
    storageLocation: unknown
    retentionDays: 0
    trainingUse: false
    certifications:
      - soc2-type2
      - iso-27001
      - iso-27017
      - iso-27018
      - iso-27701
      - iso-42001
      - pci-dss
      - csa-star-level-2
      - hipaa-eligible
