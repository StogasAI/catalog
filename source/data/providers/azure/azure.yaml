providers:
  name: Azure
  stogasByok: true
  companyId: microsoft
  # Microsoft approves a subscription for modified abuse monitoring, and then stores no prompt or
  # completion for human review. The account reports the capability ContentLogging as false, which
  # the gateway reads with each check of a credential. It covers the models that Azure sells and
  # runs, and Microsoft has announced that it will end for models released from November 1, 2026,
  # on a date that it has yet to name. Reviewed 2026-11-19:
  # https://learn.microsoft.com/en-us/azure/foundry/responsible-ai/openai/data-privacy
  # Microsoft's product terms include its business associate agreement for a customer that HIPAA
  # covers. Claude in Foundry needs Anthropic's agreement and the HIPAA configuration that Anthropic
  # enables on the subscription. Reviewed 2026-11-19: https://aka.ms/AzureCompliance and
  # https://platform.claude.com/docs/en/manage-claude/api-and-data-retention#hipaa-readiness
  accountOptions:
    - id: modified-abuse-monitoring
      name: Modified abuse monitoring
      routes: [azure-chat-completions, azure-responses]
      dataHandling:
        storageLocation: none
        retentionDays: 0
        zeroDataRetention: true
    - id: business-associate-agreement
      name: Business associate agreement
      routes:
        - azure-batch-chat-completions
        - azure-batch-responses
        - azure-chat-completions
        - azure-responses
      grants: [hipaa]
    - id: anthropic-business-associate-agreement
      name: Anthropic business associate agreement
      routes: [azure-anthropic-messages]
      grants: [hipaa]
  # A resource keeps data at rest in its Azure geography, so a credential's binding narrows storage
  # to the geography of its resource. These are the geographies that offer Foundry models.
  accountLocations:
    - AE
    - AT
    - AU
    - BE
    - BR
    - CA
    - CH
    - CL
    - DE
    - DK
    - ES
    - FI
    - FR
    - GB
    - ID
    - IL
    - IN
    - IT
    - JP
    - KR
    - MX
    - MY
    - NO
    - NZ
    - PL
    - QA
    - SA
    - SE
    - SG
    - TW
    - US
    - ZA
    - apac
    - europe
  # Appendix A of Microsoft Azure Compliance Offerings (October 2026) lists "Microsoft Foundry:
  # Foundry Models" in the scope of every audit below and of the HIPAA business associate agreement,
  # and limits that to Foundry Models sold by Azure: Azure OpenAI models and the other models that
  # Azure hosts and operates. A model that another company runs states its own list. Microsoft's
  # FedRAMP High authorization covers United States regions only.
  # Certifications reviewed 2026-11-17: https://aka.ms/AzureCompliance and
  # https://azure.microsoft.com/en-us/blog/microsoft-azure-ai-foundry-models-and-microsoft-security-copilot-achieve-iso-iec-420012023-certification/
  dataHandling:
    processingLocation: world
    storageLocation: unknown
    retentionDays: 0
    trainingUse: false
    # Azure OpenAI does not share prompt caches between subscriptions, and Claude keeps them apart
    # between organizations and workspaces on Foundry. The build drops this for other model formats.
    # Reviewed 2026-11-19: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/prompt-caching
    # and https://platform.claude.com/docs/en/build-with-claude/prompt-caching
    isolatedPromptCache: true
    certifications:
      - soc2-type2
      - iso-27001
      - iso-27017
      - iso-27018
      - iso-27701
      - iso-42001
      - pci-dss
      - csa-star-level-2
      - hipaa-eligible
