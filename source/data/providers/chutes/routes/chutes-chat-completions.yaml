routes:
  providerId: chutes
  endpoint: https://api.chutes.ai/e2e/invoke
  interfaces: [chat_completions]
  inputModalities: [text]
  capabilities:
    streaming: true
    functionCalling: true
    parallelFunctionCalling: false
    implicitPromptCaching: true
    explicitPromptCaching: false
    structuredOutputs: true
    systemMessages: true
    toolChoice: true
    toolResultAttachments: false
  # The sampling fields that Chutes' OpenAI-compatible API took in our probes, and no logit_bias.
  sampling:
    temperature: true
    topP: true
    topK: true
    frequencyPenalty: true
    presencePenalty: true
    repetitionPenalty: true
    seed: true
    logitBias: false
  dataHandling:
    endToEndEncrypted: true
  notes: Independent network operators supply the GPUs, and Chutes runs each model in a TEE that is designed to keep request content from them. A model on several Hopper GPUs sends data between them over NVLink without encryption, through switches that Chutes' evidence does not cover.
