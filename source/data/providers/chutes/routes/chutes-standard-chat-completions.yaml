routes:
  providerId: chutes
  endpoint: https://llm.chutes.ai/v1/chat/completions
  hosting: unknown
  interfaces: [chat_completions, responses]
  convertedInterfaces: [responses]
  inputModalities: [text]
  # Chutes holds no model to tool_choice none, and most of its models call the tool or write the
  # call into their text under it (capture chutes/tool-choice-none).
  capabilities:
    streaming: true
    functionCalling: true
    parallelFunctionCalling: false
    implicitPromptCaching: true
    explicitPromptCaching: false
    structuredOutputs: true
    systemMessages: true
    toolChoice: true
    toolChoiceNone: false
    toolResultImages: false
    toolResultDocuments: false
  # The sampling fields that Chutes' OpenAI-compatible API took in our probes, and no logit_bias.
  sampling:
    temperature: true
    topP: true
    topK: true
    frequencyPenalty: true
    presencePenalty: true
    repetitionPenalty: true
    seed: true
    logitBias: false
  dataHandling:
    trainingUse: null
    tee: false
