# Bedrock's US inference profile, at AWS's 10 percent premium over the global profile. From a
# US source Region it runs only in US Regions; the gateway uses no other source Region for it.
# Bedrock serves Mythos only to accounts that Anthropic's trusted access programs approve and whose
# data retention mode is aws_review or provider_data_share. Under both, AWS keeps prompts and
# completions inside AWS for up to 30 days and may review them; AWS calls provider_data_share legacy
# and shares nothing with model providers under it today.
# Prices from the AWS Price List (AmazonBedrockFoundationModels, "Standard"), reviewed 2026-11-07:
# https://pricing.us-east-1.amazonaws.com/offers/v1.0/aws/AmazonBedrockFoundationModels/current/index.json
# Regions, access and retention reviewed 2026-11-12: https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-anthropic-claude-mythos-5-1.html
# and https://docs.aws.amazon.com/bedrock/latest/userguide/data-retention.html
deployments:
  modelId: claude-mythos-5-1
  routeIds: [aws-bedrock-messages]
  upstream:
    model: us.anthropic.claude-mythos-5-1
    inferenceGeo: us
  approvalRequired: true
  overrides:
    dataHandling:
      storageLocation: US
      zeroDataRetention: false
  pricing:
    input_tokens:
      per_mill_tokens: '11'
    cached_input_tokens:
      per_mill_tokens: '0.275'
    cache_write_5m_input_tokens:
      per_mill_tokens: '13.75'
    cache_write_1h_input_tokens:
      per_mill_tokens: '22'
    output_tokens:
      per_mill_tokens: '55'
