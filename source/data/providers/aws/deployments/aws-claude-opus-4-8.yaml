# Bedrock's global inference profile, which routes across every Region with capacity.
# Prices from the AWS Price List (AmazonBedrockFoundationModels, "Standard, Global"), reviewed 2026-11-03:
# https://pricing.us-east-1.amazonaws.com/offers/v1.0/aws/AmazonBedrockFoundationModels/current/index.json
# Messages API support, limits and retention reviewed 2026-11-03: https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-anthropic-claude-opus-4-8.html
deployments:
  modelId: claude-opus-4-8
  routeIds: [aws-messages]
  hosting: aws
  upstream:
    model: global.anthropic.claude-opus-4-8
    inferenceGeo: global
  pricing:
    input_tokens:
      per_mill_tokens: '5'
    cached_input_tokens:
      per_mill_tokens: '0.5'
    cache_write_5m_input_tokens:
      per_mill_tokens: '6.25'
    cache_write_1h_input_tokens:
      per_mill_tokens: '10'
    output_tokens:
      per_mill_tokens: '25'
