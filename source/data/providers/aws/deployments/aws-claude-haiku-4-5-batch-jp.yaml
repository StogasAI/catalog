# Batch inference through Bedrock's Japan inference profile, at AWS's 10 percent premium over
# the global profile.
# Prices from the AWS Price List (AmazonBedrockFoundationModels, "Batch"), reviewed 2026-11-05:
# https://pricing.us-east-1.amazonaws.com/offers/v1.0/aws/AmazonBedrockFoundationModels/current/index.json
deployments:
  modelId: claude-haiku-4-5
  routeIds: [aws-batch-messages]
  hosting: aws
  upstream:
    model: jp.anthropic.claude-haiku-4-5-20251001-v1:0
    inferenceGeo: jp
  overrides:
    dataHandling:
      processingLocation: JP
  pricing:
    input_tokens:
      per_mill_tokens: '0.55'
    output_tokens:
      per_mill_tokens: '2.75'
