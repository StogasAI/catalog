# Batch inference through Bedrock's EU inference profile, at AWS's 10 percent premium over
# the global profile.
# Prices from the AWS Price List (AmazonBedrockFoundationModels, "Batch"), reviewed 2026-11-05:
# https://pricing.us-east-1.amazonaws.com/offers/v1.0/aws/AmazonBedrockFoundationModels/current/index.json
deployments:
  modelId: claude-sonnet-4-6
  routeIds: [aws-batch-messages]
  upstream:
    model: eu.anthropic.claude-sonnet-4-6
    hosting: aws
    inferenceGeo: eu
    serviceTier: batch
  overrides:
    dataHandling:
      processingLocation: eu
      storageLocation: unknown
      retentionDays: null
  pricing:
    input_tokens:
      per_mill_tokens: '1.65'
    output_tokens:
      per_mill_tokens: '8.25'
