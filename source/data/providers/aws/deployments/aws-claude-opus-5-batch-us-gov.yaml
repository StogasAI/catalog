# Batch inference through Bedrock's inference profile of the AWS GovCloud (US) Regions, a separate
# AWS partition with its own accounts and hosts, at half of the profile's on-demand prices.
# Prices from the AWS Price List of us-gov-west-1 and us-gov-east-1 ("Batch"), reviewed 2026-11-17:
# https://pricing.us-east-1.amazonaws.com/offers/v1.0/aws/AmazonBedrockFoundationModels/current/us-gov-west-1/index.json
deployments:
  modelId: claude-opus-5
  routeIds: [aws-bedrock-batch-messages]
  upstream:
    model: us-gov.anthropic.claude-opus-5
    inferenceGeo: us-gov
  pricing:
    input_tokens:
      per_mill_tokens: '3'
    output_tokens:
      per_mill_tokens: '15'
