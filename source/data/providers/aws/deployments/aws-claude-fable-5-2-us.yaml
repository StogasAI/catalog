# Bedrock's US inference profile, at AWS's 10 percent premium over the global profile. From a
# US source Region it runs only in US Regions; the gateway uses no other source Region for it.
# Under the aws_review data retention mode that this model requires, AWS keeps prompts and
# completions inside AWS for up to 30 days and may review them.
# Prices from the AWS Price List (AmazonBedrockFoundationModels, "Standard"), reviewed 2026-11-10:
# https://pricing.us-east-1.amazonaws.com/offers/v1.0/aws/AmazonBedrockFoundationModels/current/index.json
# Regions and retention reviewed 2026-11-10: https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-anthropic-claude-fable-5-2.html
deployments:
  modelId: claude-fable-5-2
  routeIds: [aws-bedrock-messages]
  upstream:
    model: us.anthropic.claude-fable-5-2
    inferenceGeo: us
  overrides:
    dataHandling:
      storageLocation: US
      zeroDataRetention: false
  pricing:
    input_tokens:
      per_mill_tokens: '8.8'
    cached_input_tokens:
      per_mill_tokens: '0.22'
    cache_write_5m_input_tokens:
      per_mill_tokens: '11'
    cache_write_1h_input_tokens:
      per_mill_tokens: '17.6'
    output_tokens:
      per_mill_tokens: '44'
