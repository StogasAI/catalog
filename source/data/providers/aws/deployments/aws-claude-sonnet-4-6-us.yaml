# Bedrock's US inference profile, at AWS's 10 percent premium over the global profile. From a
# US source Region it runs only in US Regions; the gateway uses no other source Region for it.
# Prices from the AWS Price List (AmazonBedrockFoundationModels, "Standard"), reviewed 2026-11-03:
# https://pricing.us-east-1.amazonaws.com/offers/v1.0/aws/AmazonBedrockFoundationModels/current/index.json
# The model card marks the Messages API unsupported and gives 64K output tokens, but on 2026-11-03
# the Messages API served both profiles and refused only more than 128,000 output tokens:
# https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-anthropic-claude-sonnet-4-6.html
deployments:
  modelId: claude-sonnet-4-6
  routeIds: [aws-bedrock-messages]
  upstream:
    model: us.anthropic.claude-sonnet-4-6
    inferenceGeo: us
  pricing:
    input_tokens:
      per_mill_tokens: '3.3'
    cached_input_tokens:
      per_mill_tokens: '0.33'
    cache_write_5m_input_tokens:
      per_mill_tokens: '4.125'
    cache_write_1h_input_tokens:
      per_mill_tokens: '6.6'
    output_tokens:
      per_mill_tokens: '16.5'
