# Anthropic's Message Batches API on Claude Platform on AWS, at Anthropic's batch prices.
# Reviewed 2026-11-05: https://platform.claude.com/docs/en/build-with-claude/claude-platform-on-aws
# and https://platform.claude.com/docs/en/about-claude/pricing#claude-platform-on-aws-pricing
deployments:
  modelId: claude-haiku-5-5
  routeIds: [aws-batch-messages]
  hosting: anthropic
  upstream:
    model: claude-haiku-5-5
    inferenceGeo: global
  overrides:
    dataHandling:
      retentionDays: 29
  pricing:
    input_tokens:
      per_mill_tokens: '0.05'
      per_mill_context_gt_100k: '0.25'
    cached_input_tokens:
      per_mill_tokens: '0.005'
      per_mill_context_gt_100k: '0.025'
    cache_write_5m_input_tokens:
      per_mill_tokens: '0.0625'
      per_mill_context_gt_100k: '0.3125'
    cache_write_1h_input_tokens:
      per_mill_tokens: '0.1'
      per_mill_context_gt_100k: '0.5'
    output_tokens:
      per_mill_tokens: '0.25'
      per_mill_context_gt_100k: '1.25'
