# Bedrock's inference profile of the AWS GovCloud (US) Regions, a separate AWS partition with its
# own accounts and hosts, at 20 percent over the price of the global profile. From either GovCloud
# Region it runs only in the two of them.
# Prices from the AWS Price List of us-gov-west-1 and us-gov-east-1 ("Standard"), reviewed 2026-11-16:
# https://pricing.us-east-1.amazonaws.com/offers/v1.0/aws/AmazonBedrockFoundationModels/current/us-gov-west-1/index.json
# Regions reviewed 2026-11-16: https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-anthropic-claude-opus-5.html
# Profile ID prefix reviewed 2026-11-16: https://aws.amazon.com/govcloud-us/newsletter/newsletter-issue-04/
# AWS names Amazon Bedrock in its FedRAMP High authorization and in its DoD provisional
# authorizations up to Impact Level 5 for the AWS GovCloud (US) Regions. Its other audits name the
# service without naming these Regions. Certifications reviewed 2026-11-17:
# https://aws.amazon.com/compliance/services-in-scope/FedRAMP/ and
# https://aws.amazon.com/compliance/services-in-scope/DoD_CC_SRG/
deployments:
  modelId: claude-opus-5
  routeIds: [aws-bedrock-messages]
  upstream:
    model: us-gov.anthropic.claude-opus-5
    inferenceGeo: us-gov
  stogasByok: false
  overrides:
    dataHandling:
      certifications: [fedramp-moderate, fedramp-high, dod-il2, dod-il4, dod-il5]
  pricing:
    input_tokens:
      per_mill_tokens: '6'
    cached_input_tokens:
      per_mill_tokens: '0.6'
    cache_write_5m_input_tokens:
      per_mill_tokens: '7.5'
    cache_write_1h_input_tokens:
      per_mill_tokens: '12'
    output_tokens:
      per_mill_tokens: '30'
