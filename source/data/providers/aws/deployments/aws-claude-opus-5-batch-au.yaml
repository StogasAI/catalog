# Batch inference through Bedrock's Australia inference profile, at AWS's 10 percent premium over
# the global profile.
# Prices from the AWS Price List (AmazonBedrockFoundationModels, "Batch"), reviewed 2026-11-05:
# https://pricing.us-east-1.amazonaws.com/offers/v1.0/aws/AmazonBedrockFoundationModels/current/index.json
deployments:
  modelId: claude-opus-5
  routeIds: [aws-bedrock-batch-messages]
  upstream:
    model: au.anthropic.claude-opus-5
    inferenceGeo: au
  pricing:
    input_tokens:
      per_mill_tokens: '2.75'
    output_tokens:
      per_mill_tokens: '13.75'
