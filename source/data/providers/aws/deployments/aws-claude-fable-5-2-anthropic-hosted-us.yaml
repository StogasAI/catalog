# Claude Platform on AWS rates usage at Anthropic's standard prices, and US inference at its
# multiplier. Reviewed 2026-11-10: https://platform.claude.com/docs/en/build-with-claude/claude-platform-on-aws
# and https://platform.claude.com/docs/en/about-claude/pricing#claude-platform-on-aws-pricing
deployments:
  modelId: claude-fable-5-2
  routeIds: [aws-claude-platform-messages]
  hosting: anthropic
  upstream:
    model: claude-fable-5-2
    inferenceGeo: us
  overrides:
    dataHandling:
      processingLocation: US
  pricing:
    input_tokens:
      per_mill_tokens: '8.8'
    cached_input_tokens:
      per_mill_tokens: '0.22'
    cache_write_5m_input_tokens:
      per_mill_tokens: '11'
    cache_write_1h_input_tokens:
      per_mill_tokens: '17.6'
    output_tokens:
      per_mill_tokens: '44'
