# Bedrock's global inference profile, which routes across every Region with capacity.
# Under the aws_review data retention mode that this model requires, AWS keeps prompts and
# completions inside AWS for up to 30 days and may review them.
# Prices from the AWS Price List (AmazonBedrockFoundationModels, "Standard, Global"), reviewed 2026-11-03:
# https://pricing.us-east-1.amazonaws.com/offers/v1.0/aws/AmazonBedrockFoundationModels/current/index.json
# Messages API support, limits and retention reviewed 2026-11-03: https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-anthropic-claude-fable-5.html
deployments:
  modelId: claude-fable-5
  routeIds: [aws-bedrock-messages]
  upstream:
    model: global.anthropic.claude-fable-5
    inferenceGeo: global
  overrides:
    dataHandling:
      storageLocation: world
      retentionDays: 30
  pricing:
    input_tokens:
      per_mill_tokens: '10'
    cached_input_tokens:
      per_mill_tokens: '1'
    cache_write_5m_input_tokens:
      per_mill_tokens: '12.5'
    cache_write_1h_input_tokens:
      per_mill_tokens: '20'
    output_tokens:
      per_mill_tokens: '50'
