# Anthropic's Message Batches API on Claude Platform on AWS, at Anthropic's batch prices.
# Reviewed 2026-11-05: https://platform.claude.com/docs/en/build-with-claude/claude-platform-on-aws
# and https://platform.claude.com/docs/en/about-claude/pricing#claude-platform-on-aws-pricing
deployments:
  modelId: claude-haiku-5-5
  routeIds: [aws-claude-platform-message-batches]
  hosting: anthropic
  upstream:
    model: claude-haiku-5-5
    inferenceGeo: us
  overrides:
    dataHandling:
      processingLocation: US
  pricing:
    input_tokens:
      per_mill_tokens: '0.055'
      per_mill_context_gt_100k: '0.275'
    cached_input_tokens:
      per_mill_tokens: '0.0055'
      per_mill_context_gt_100k: '0.0275'
    cache_write_5m_input_tokens:
      per_mill_tokens: '0.06875'
      per_mill_context_gt_100k: '0.34375'
    cache_write_1h_input_tokens:
      per_mill_tokens: '0.11'
      per_mill_context_gt_100k: '0.55'
    output_tokens:
      per_mill_tokens: '0.275'
      per_mill_context_gt_100k: '1.375'
