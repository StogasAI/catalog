# Anthropic's Message Batches API on Claude Platform on AWS, at Anthropic's batch prices.
# Reviewed 2026-11-05: https://platform.claude.com/docs/en/build-with-claude/claude-platform-on-aws
# and https://platform.claude.com/docs/en/about-claude/pricing#claude-platform-on-aws-pricing
deployments:
  modelId: claude-sonnet-4-6
  routeIds: [aws-batch-messages]
  upstream:
    model: claude-sonnet-4-6
    hosting: anthropic
    inferenceGeo: global
  overrides:
    dataHandling:
      retentionDays: 29
  pricing:
    input_tokens:
      per_mill_tokens: '1.5'
    cached_input_tokens:
      per_mill_tokens: '0.15'
    cache_write_5m_input_tokens:
      per_mill_tokens: '1.875'
    cache_write_1h_input_tokens:
      per_mill_tokens: '3'
    output_tokens:
      per_mill_tokens: '7.5'
