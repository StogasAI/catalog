# Batch inference through Bedrock's global inference profile.
# Prices from the AWS Price List (AmazonBedrockFoundationModels, "Batch, Global"), reviewed 2026-11-05:
# https://pricing.us-east-1.amazonaws.com/offers/v1.0/aws/AmazonBedrockFoundationModels/current/index.json
deployments:
  modelId: claude-sonnet-4-6
  routeIds: [aws-bedrock-batch-messages]
  upstream:
    model: global.anthropic.claude-sonnet-4-6
    inferenceGeo: global
  pricing:
    input_tokens:
      per_mill_tokens: '1.5'
    output_tokens:
      per_mill_tokens: '7.5'
