# Bedrock's US inference profile, at AWS's 10 percent premium over the global profile. From a
# US source Region it runs only in US Regions; the gateway uses no other source Region for it.
# Prices from the AWS Price List (AmazonBedrockFoundationModels, "Standard"), reviewed 2026-11-03:
# https://pricing.us-east-1.amazonaws.com/offers/v1.0/aws/AmazonBedrockFoundationModels/current/index.json
# Messages API support, limits and retention reviewed 2026-11-03: https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-anthropic-claude-haiku-4-5.html
deployments:
  modelId: claude-haiku-4-5
  routeIds: [aws-messages]
  upstream:
    model: us.anthropic.claude-haiku-4-5-20251001-v1:0
    hosting: aws
    inferenceGeo: us
  overrides:
    dataHandling:
      processingLocation: US
  pricing:
    input_tokens:
      per_mill_tokens: '1.1'
    cached_input_tokens:
      per_mill_tokens: '0.11'
    cache_write_5m_input_tokens:
      per_mill_tokens: '1.375'
    cache_write_1h_input_tokens:
      per_mill_tokens: '2.2'
    output_tokens:
      per_mill_tokens: '5.5'
