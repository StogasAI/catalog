# Bedrock's global inference profile, which routes across every Region with capacity.
# Under the aws_review data retention mode that this model requires, AWS keeps prompts and
# completions inside AWS for up to 30 days and may review them.
# Prices from the AWS Price List (AmazonBedrockFoundationModels, "Standard, Global"), reviewed 2026-11-10:
# https://pricing.us-east-1.amazonaws.com/offers/v1.0/aws/AmazonBedrockFoundationModels/current/index.json
# Retention reviewed 2026-11-10: https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-anthropic-claude-fable-5-2.html
deployments:
  modelId: claude-fable-5-2
  routeIds: [aws-messages]
  hosting: aws
  upstream:
    model: global.anthropic.claude-fable-5-2
    inferenceGeo: global
  overrides:
    dataHandling:
      storageLocation: world
      retentionDays: 30
  pricing:
    input_tokens:
      per_mill_tokens: '8'
    cached_input_tokens:
      per_mill_tokens: '0.2'
    cache_write_5m_input_tokens:
      per_mill_tokens: '10'
    cache_write_1h_input_tokens:
      per_mill_tokens: '16'
    output_tokens:
      per_mill_tokens: '40'
