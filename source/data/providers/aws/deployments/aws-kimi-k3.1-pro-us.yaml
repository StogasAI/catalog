# Bedrock's US inference profile, at AWS's 10 percent premium over the global profile. From a
# US source Region it runs only in US Regions; the gateway uses no other source Region for it.
# AWS names the model Kimi K3.1 Pro - Highspeed and links Moonshot AI's Kimi-K3.1-Pro weights.
# Prices, Chat Completions support, limits, caching and retention from its model card, reviewed
# 2026-11-20; the AWS Price List has no rows for it yet:
# https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-moonshot-ai-kimi-k3-1-highspeed.html
deployments:
  modelId: kimi-k3.1-pro
  routeIds: [aws-bedrock-chat-completions]
  upstream:
    model: us.moonshotai.kimi-k3.1
    inferenceGeo: us
  overrides:
    # Bedrock answers without reasoning at reasoning_effort none, and the model reasons at max
    # without an effort (capture aws/chat-completions-efforts).
    reasoning: optional
    reasoningDefault: max
    promptCacheMinimumTokens: 256
    # Bedrock refuses top_p other than 0.95 and penalties other than 0 for Kimi, and takes seed
    # without applying it (capture aws/chat-completions-request-fields).
    sampling:
      topP: false
      frequencyPenalty: false
      presencePenalty: false
      seed: false
  pricing:
    input_tokens:
      per_mill_tokens: '4.4'
    cached_input_tokens:
      per_mill_tokens: '0.22'
    cache_write_input_tokens:
      per_mill_tokens: '5.5'
    output_tokens:
      per_mill_tokens: '22'
