# Bedrock runs Mistral Large 3 only in the Region of each request, at the same prices in each US
# Region.
# Prices from the AWS Price List (AmazonBedrock, Mistral-Large-3-675b-Instruct-input-tokens and
# Mistral-Large-3-675b-Instruct-output-tokens), reviewed 2026-11-20:
# https://pricing.us-east-1.amazonaws.com/offers/v1.0/aws/AmazonBedrock/current/index.json
# Regions and Chat Completions support reviewed 2026-11-20:
# https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-mistral-ai-mistral-large-3.html
deployments:
  modelId: mistral-large-2512
  routeIds: [aws-bedrock-chat-completions]
  upstream:
    model: mistral.mistral-large-3-675b-instruct
    inferenceGeo: us
    regions: [us-east-1, us-east-2, us-west-2]
  overrides:
    # Bedrock refuses an image in a tool message and logit_bias, caches no prompt and leaves every
    # document out of the prompt (captures aws/chat-completions-in-region-files,
    # aws/chat-completions-in-region-fields and aws/chat-completions-in-region-caching).
    capabilities:
      implicitPromptCaching: false
      explicitPromptCaching: false
      toolResultImages: false
    sampling:
      logitBias: false
    documentFormats:
      mediaTypes: []
      extensions: []
  pricing:
    input_tokens:
      per_mill_tokens: '0.5'
    output_tokens:
      per_mill_tokens: '1.5'
