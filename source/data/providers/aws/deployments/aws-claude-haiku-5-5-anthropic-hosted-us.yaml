# Claude Platform on AWS rates usage at Anthropic's standard prices, and US inference at its
# multiplier. Reviewed 2026-11-05: https://platform.claude.com/docs/en/build-with-claude/claude-platform-on-aws
# and https://platform.claude.com/docs/en/about-claude/pricing#claude-platform-on-aws-pricing
deployments:
  modelId: claude-haiku-5-5
  routeIds: [aws-messages]
  hosting: anthropic
  upstream:
    model: claude-haiku-5-5
    inferenceGeo: us
  overrides:
    dataHandling:
      processingLocation: US
      retentionDays: 30
  pricing:
    input_tokens:
      per_mill_tokens: '0.11'
      per_mill_context_gt_100k: '0.55'
    cached_input_tokens:
      per_mill_tokens: '0.011'
      per_mill_context_gt_100k: '0.055'
    cache_write_5m_input_tokens:
      per_mill_tokens: '0.1375'
      per_mill_context_gt_100k: '0.6875'
    cache_write_1h_input_tokens:
      per_mill_tokens: '0.22'
      per_mill_context_gt_100k: '1.1'
    output_tokens:
      per_mill_tokens: '0.55'
      per_mill_context_gt_100k: '2.75'
