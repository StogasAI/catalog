providers:
  name: AWS
  credentialModes: [byok]
  headquarteredCountry: US
  capabilities:
    streaming: true
    functionCalling: true
    parallelFunctionCalling: true
    implicitPromptCaching: false
    explicitPromptCaching: true
    structuredOutputs: true
    systemMessages: true
    toolChoice: true
  # In Bedrock's default data retention mode, retention depends on the model's terms and AWS may keep
  # data for safety and abuse prevention, in the Region where the account uses Bedrock. Zero
  # retention is an account setting, not the default.
  # Reviewed 2026-11-09: https://docs.aws.amazon.com/bedrock/latest/userguide/data-retention.html
  # and https://aws.amazon.com/bedrock/faqs/
  dataHandling:
    processingLocation: world
    storageLocation: unknown
    retentionDays: null
    trainingUse: false
    zeroDataRetention: false
    tee: false
    teeVerified: false
