providers:
  name: AWS
  stogasByok: true
  companyId: amazon
  # In Bedrock's default data retention mode, retention depends on the model's terms and AWS may keep
  # data for safety and abuse prevention, in the Region where the account uses Bedrock. Zero
  # retention is an account setting, not the default.
  # Reviewed 2026-11-09: https://docs.aws.amazon.com/bedrock/latest/userguide/data-retention.html
  # and https://aws.amazon.com/bedrock/faqs/
  # AWS names Amazon Bedrock in the scope of each audit below and as a HIPAA eligible service. Its
  # FedRAMP and DoD authorizations name Regions, so only the deployments of those Regions list them.
  # Certifications reviewed 2026-11-17: https://aws.amazon.com/compliance/services-in-scope/,
  # https://aws.amazon.com/compliance/hipaa-eligible-services-reference/ and
  # https://aws.amazon.com/bedrock/security-compliance/
  dataHandling:
    processingLocation: world
    storageLocation: unknown
    retentionDays: null
    trainingUse: false
    certifications:
      - soc2-type2
      - iso-27001
      - iso-27017
      - iso-27018
      - iso-27701
      - iso-42001
      - pci-dss
      - csa-star-level-2
      - hipaa-eligible
