providers:
  name: AWS
  stogasByok: true
  companyId: amazon
  # Claude Platform on AWS follows the retention of Anthropic's own API, and Anthropic enables zero
  # data retention for an organization on request. Reviewed 2026-11-19:
  # https://platform.claude.com/docs/en/manage-claude/api-and-data-retention#what-zdr-covers
  # A customer accepts AWS's business associate agreement in AWS Artifact, and it covers Amazon
  # Bedrock and each of its generally available features, such as the Chat Completions API and
  # active models. Reviewed 2026-11-20:
  # https://aws.amazon.com/compliance/hipaa-eligible-services-reference/
  # AWS's API reports neither.
  accountOptions:
    - id: zero-data-retention
      name: Anthropic zero data retention
      routes: [aws-claude-platform-messages]
      dataHandling:
        storageLocation: none
        retentionDays: 0
        zeroDataRetention: true
    - id: business-associate-agreement
      name: Business associate agreement
      routes: [aws-bedrock-batch-messages, aws-bedrock-chat-completions, aws-bedrock-messages]
      grants: [hipaa]
  # Each Bedrock model decides what AWS keeps, through the data retention modes that it allows, and
  # the account's mode only decides which models answer. A route or deployment states what its
  # models keep, and the provider leaves it unknown.
  # Reviewed 2026-11-18: https://docs.aws.amazon.com/bedrock/latest/userguide/data-retention.html
  # and https://aws.amazon.com/bedrock/faqs/
  # AWS names Amazon Bedrock in the scope of each audit below and as a HIPAA eligible service. Its
  # FedRAMP and DoD authorizations name Regions, so only the deployments of those Regions list them.
  # Certifications reviewed 2026-11-17: https://aws.amazon.com/compliance/services-in-scope/,
  # https://aws.amazon.com/compliance/hipaa-eligible-services-reference/ and
  # https://aws.amazon.com/bedrock/security-compliance/
  dataHandling:
    processingLocation: world
    storageLocation: unknown
    retentionDays: null
    trainingUse: false
    # Claude's prompt caches stay apart between organizations on Amazon Bedrock, and also between
    # workspaces on Claude Platform on AWS. Reviewed 2026-11-19:
    # https://platform.claude.com/docs/en/build-with-claude/prompt-caching
    isolatedPromptCache: true
    certifications:
      - soc2-type2
      - iso-27001
      - iso-27017
      - iso-27018
      - iso-27701
      - iso-42001
      - pci-dss
      - csa-star-level-2
      - hipaa-eligible
