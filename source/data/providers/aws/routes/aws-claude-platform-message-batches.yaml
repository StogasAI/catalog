# Anthropic's Message Batches API on Claude Platform on AWS, at
# https://aws-external-anthropic.{region}.api.aws/v1/messages/batches, runs Messages requests at half
# of every token price, and server tools keep their own prices. Batch requests cannot stream. Results
# stay available for 29 days, as on Anthropic's own API, so each deployment keeps them for 29 days,
# and the Fable models keep their 30 days.
# Reviewed 2026-11-05:
# https://platform.claude.com/docs/en/build-with-claude/claude-platform-on-aws
# https://platform.claude.com/docs/en/about-claude/pricing#claude-platform-on-aws-pricing
routes:
  providerId: aws
  interfaces: [chat_completions, responses]
  batch: true
  inputModalities: [text, image]
  documentFormats:
    extensions: [.csv, .md, .pdf, .txt]
    mediaTypes: [application/pdf, text/plain]
  dataHandling:
    retentionDays: 29
  notes: The gateway has no batch API and serves each request as it arrives.
  hostedTools:
    - tool: web_search
      pricing:
        anthropic_web_search_calls:
          per_1k_calls: '10'
      dataHandling:
        processingLocation: unknown
    - tool: web_fetch
      dataHandling:
        processingLocation: unknown
        storageLocation: unknown
        retentionDays: null
        zeroDataRetention: false
  overrides:
    capabilities:
      streaming: false
