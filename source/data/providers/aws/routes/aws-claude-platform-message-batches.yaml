# Anthropic's Message Batches API on Claude Platform on AWS, at
# https://aws-external-anthropic.{region}.api.aws/v1/messages/batches, runs Messages requests at half
# of every token price, and server tools keep their own prices. Batch requests cannot stream. Results
# stay available for 29 days, as on Anthropic's own API, so each deployment keeps them for 29 days,
# and the Fable models keep their 30 days.
# Reviewed 2026-11-05:
# https://platform.claude.com/docs/en/build-with-claude/claude-platform-on-aws
# https://platform.claude.com/docs/en/about-claude/pricing#claude-platform-on-aws-pricing
routes:
  providerId: aws
  hosting: anthropic
  interfaces: [chat_completions, responses]
  batch: true
  inputModalities: [text, image]
  capabilities:
    streaming: false
    functionCalling: true
    parallelFunctionCalling: true
    implicitPromptCaching: false
    explicitPromptCaching: true
    structuredOutputs: true
    systemMessages: true
    toolChoice: true
    toolResultAttachments: true
  # The sampling fields of the Messages API, which both of its Claude products take. Reviewed
  # 2026-11-15: https://platform.claude.com/docs/en/api/messages/create
  sampling:
    temperature: true
    topP: true
    topK: true
    frequencyPenalty: false
    presencePenalty: false
    repetitionPenalty: false
    seed: false
    logitBias: false
  documentFormats:
    extensions: [.csv, .md, .pdf, .txt]
    mediaTypes: [application/pdf, text/plain]
  # Anthropic runs this API, so its audits apply and the provider's do not. Its business associate
  # agreement does not name this product. Certifications reviewed 2026-11-17:
  # https://support.claude.com/en/articles/10015870
  dataHandling:
    retentionDays: 29
    certifications: [soc2-type2, iso-27001, iso-42001]
  hostedTools:
    - tool: web_search
      pricing:
        anthropic_web_search_calls:
          per_1k_calls: '10'
      dataHandling:
        processingLocation: unknown
    - tool: web_fetch
      dataHandling:
        processingLocation: unknown
        storageLocation: unknown
        retentionDays: null
        zeroDataRetention: false
        sharedWith: [unknown]
