# Claude on AWS runs files of Messages requests as jobs two ways; each deployment's hosting picks one.
# Hosting aws is Bedrock's batch inference at https://bedrock.{region}.amazonaws.com/model-invocation-job,
# through the same inference profiles at about half of the on-demand price. A job reads its requests
# from, and writes its results to, S3 buckets in the customer's account, so the customer chooses where
# they are stored and for how long, and the place and retention of its deployments stay unknown.
# The AWS Price List bills only their input and output tokens.
# Hosting anthropic is Anthropic's Message Batches API on Claude Platform on AWS, at
# https://aws-external-anthropic.{region}.api.aws/v1/messages/batches, at half of every token price.
# Its results stay available for 29 days, as on Anthropic's own API.
# Batch requests cannot stream. Reviewed 2026-11-05:
# https://docs.aws.amazon.com/bedrock/latest/userguide/batch-inference.html
# https://docs.aws.amazon.com/bedrock/latest/userguide/batch-inference-supported.html
# https://pricing.us-east-1.amazonaws.com/offers/v1.0/aws/AmazonBedrockFoundationModels/current/index.json
# https://platform.claude.com/docs/en/build-with-claude/claude-platform-on-aws
# https://platform.claude.com/docs/en/about-claude/pricing#claude-platform-on-aws-pricing
routes:
  providerId: aws
  interfaces: [chat_completions, responses]
  batch: true
  inputModalities: [text, image]
  documentFormats:
    extensions: [.csv, .md, .pdf, .txt]
    mediaTypes: [application/pdf, text/plain]
  dataHandling:
    endToEndEncrypted: false
  notes: Amazon Bedrock runs Claude on AWS. Claude Platform on AWS is Anthropic's own API, which Anthropic runs and AWS bills. The gateway has no batch API and serves each request as it arrives.
  # Only Claude Platform on AWS runs web search and web fetch, at Anthropic's prices, as on its
  # Messages route.
  hostedTools:
    - tool: web_search
      hostings: [anthropic]
      pricing:
        anthropic_web_search_calls:
          per_1k_calls: '10'
      dataHandling:
        processingLocation: unknown
    - tool: web_fetch
      hostings: [anthropic]
      dataHandling:
        processingLocation: unknown
        storageLocation: unknown
        retentionDays: null
        zeroDataRetention: false
  overrides:
    capabilities:
      streaming: false
