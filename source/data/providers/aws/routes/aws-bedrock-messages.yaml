# Claude in Amazon Bedrock: https://bedrock-runtime.{region}.amazonaws.com/anthropic/v1/messages,
# called with an inference profile ID. Bedrock-mantle serves Fable 5.1 only in GovCloud.
# It has no URL sources, Files API, server-side tools, task budgets or fallbacks.
# Reviewed 2026-10-31: https://platform.claude.com/docs/en/build-with-claude/claude-in-amazon-bedrock
# and https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-anthropic-claude-fable-5-1.html
routes:
  providerId: aws
  interfaces: [chat_completions, responses, messages]
  convertedInterfaces: [chat_completions, responses]
  inputModalities: [text, image]
  capabilities:
    streaming: true
    functionCalling: true
    parallelFunctionCalling: true
    implicitPromptCaching: false
    explicitPromptCaching: true
    structuredOutputs: true
    systemMessages: true
    toolChoice: true
    toolChoiceNone: true
    toolResultImages: true
    toolResultDocuments: true
  # The sampling fields of the Messages API, which both of its Claude products take. Reviewed
  # 2026-11-15: https://platform.claude.com/docs/en/api/messages/create
  sampling:
    temperature: true
    topP: true
    topK: true
    frequencyPenalty: false
    presencePenalty: false
    repetitionPenalty: false
    seed: false
    logitBias: false
  # Bedrock states the image limit as 5 MB of base64 text.
  # Reviewed 2026-11-15: https://platform.claude.com/docs/en/api/overview#request-size-limits,
  # https://platform.claude.com/docs/en/build-with-claude/vision#request-limits and
  # https://platform.claude.com/docs/en/build-with-claude/pdf-support
  inputLimits:
    requestBytes: 20000000
    images:
      count: 600
      bytes: 3750000
      pixels: 8000
    documents:
      pages: 600
  documentFormats:
    extensions: [.csv, .md, .pdf, .txt]
    mediaTypes: [application/pdf, text/plain]
  # Bedrock keeps nothing of a request to a model whose allowed_modes include none, whatever data
  # retention mode the account sets. Every Claude model allows none but Fable and Mythos, whose
  # deployments state what AWS keeps. Bedrock may still store an image that its scan flags as
  # apparent child sexual abuse material, to confirm and report it.
  # Reviewed 2026-11-18: https://docs.aws.amazon.com/bedrock/latest/userguide/data-retention.html
  # and https://docs.aws.amazon.com/bedrock/latest/userguide/abuse-detection.html
  dataHandling:
    storageLocation: none
    retentionDays: 0
    zeroDataRetention: true
