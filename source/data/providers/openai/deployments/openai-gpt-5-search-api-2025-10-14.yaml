deployments:
  modelId: gpt-5-search-api-2025-10-14
  routeIds: [openai-chat-completions]
  hosting: openai
  upstream:
    model: gpt-5-search-api-2025-10-14
  pricing:
    input_tokens:
      per_mill_tokens: '1.25'
    cached_input_tokens:
      per_mill_tokens: '0.125'
    output_tokens:
      per_mill_tokens: '10'
    # The model searches on every request, and OpenAI charges its web search price per call.
    # Reviewed 2026-11-10: https://developers.openai.com/api/docs/pricing
    openai_chat_completion_search_model_calls:
      per_1k_calls: '10'
