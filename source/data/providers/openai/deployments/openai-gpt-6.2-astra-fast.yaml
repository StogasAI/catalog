deployments:
  modelId: gpt-6.2-astra
  routeIds: [openai-chat-completions, openai-responses]
  upstream:
    model: gpt-6.2-astra
    serviceTier: fast
  overrides:
    # OpenAI takes these only at reasoning effort none, which this model lacks. Reviewed
    # 2026-11-18: https://developers.openai.com/api/docs/guides/reasoning
    sampling:
      temperature: false
      topP: false
  pricing:
    input_tokens:
      per_mill_tokens: '16'
      per_mill_context_gt_272k: '32'
    cached_input_tokens:
      per_mill_tokens: '0.8'
      per_mill_context_gt_272k: '1.6'
    cache_write_input_tokens:
      per_mill_tokens: '20'
      per_mill_context_gt_272k: '40'
    output_tokens:
      per_mill_tokens: '80'
      per_mill_context_gt_272k: '120'
