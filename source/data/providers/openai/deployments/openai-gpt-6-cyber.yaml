deployments:
  modelId: gpt-6-cyber
  routeIds: [openai-chat-completions, openai-responses]
  hosting: openai
  upstream:
    model: gpt-6-cyber
  approvalRequired: true
  stogasUnsupported: OpenAI accepts its requests only from IP addresses that your project allowlists, and the gateway's address is not public.
  # OpenAI lists no long context cache write price for this model. Every GPT-6 cache write costs
  # 1.25 times the input price at both context sizes, which gives 50.
  # Reviewed 2026-11-10: https://developers.openai.com/api/docs/pricing
  pricing:
    input_tokens:
      per_mill_tokens: '20'
      per_mill_context_gt_272k: '40'
    cached_input_tokens:
      per_mill_tokens: '2'
      per_mill_context_gt_272k: '4'
    cache_write_input_tokens:
      per_mill_tokens: '25'
      per_mill_context_gt_272k: '50'
    output_tokens:
      per_mill_tokens: '100'
      per_mill_context_gt_272k: '150'
