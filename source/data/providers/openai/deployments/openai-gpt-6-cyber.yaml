deployments:
  modelId: gpt-6-cyber
  routeIds: [openai-chat-completions, openai-responses]
  upstream:
    model: gpt-6-cyber
  approvalRequired: true
  notes: OpenAI accepts its requests only from IP addresses that your project allowlists, so allowlist the gateway's address.
  # OpenAI's pricing page lists no long context cache write price for this model. Its prompt
  # caching guide prices a cache write of GPT-5.6 and later at 1.25 times the uncached input price,
  # which gives 50 at the long context input price of 40.
  # Reviewed 2026-11-16: https://developers.openai.com/api/docs/pricing
  # and https://developers.openai.com/api/docs/guides/prompt-caching
  pricing:
    input_tokens:
      per_mill_tokens: '20'
      per_mill_context_gt_272k: '40'
    cached_input_tokens:
      per_mill_tokens: '2'
      per_mill_context_gt_272k: '4'
    cache_write_input_tokens:
      per_mill_tokens: '25'
      per_mill_context_gt_272k: '50'
    cache_write_12h_input_tokens:
      per_mill_tokens: '50'
      per_mill_context_gt_272k: '100'
    output_tokens:
      per_mill_tokens: '100'
      per_mill_context_gt_272k: '150'
