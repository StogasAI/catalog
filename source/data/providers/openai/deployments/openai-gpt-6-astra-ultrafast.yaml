deployments:
  modelId: gpt-6-astra
  routeIds: [openai-responses]
  upstream:
    model: gpt-6-astra
    serviceTier: ultrafast
  overrides:
    # OpenAI takes these only at reasoning effort none, which this model lacks. Reviewed
    # 2026-11-15: https://developers.openai.com/api/docs/guides/latest-model
    sampling:
      temperature: false
      topP: false
  pricing:
    input_tokens:
      per_mill_tokens: '60'
      per_mill_context_gt_272k: '120'
    cached_input_tokens:
      per_mill_tokens: '6'
      per_mill_context_gt_272k: '12'
    cache_write_input_tokens:
      per_mill_tokens: '75'
      per_mill_context_gt_272k: '150'
    output_tokens:
      per_mill_tokens: '300'
      per_mill_context_gt_272k: '450'
