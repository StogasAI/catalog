# OpenAI's data residency endpoint for Europe (eu.api.openai.com), which stores and runs
# requests there. Reviewed 2026-11-16: https://developers.openai.com/api/docs/guides/data-residency
deployments:
  modelId: gpt-5-nano-2025-08-07
  routeIds: [openai-chat-completions, openai-responses]
  upstream:
    model: gpt-5-nano-2025-08-07
    inferenceGeo: eu
  stogasSupported: false
  # Reviewed 2026-11-13: https://developers.openai.com/api/docs/deprecations
  retirementDate: 2026-12-11
  overrides:
    # OpenAI takes these only at reasoning effort none, which this model lacks. Reviewed
    # 2026-11-15: https://developers.openai.com/api/docs/guides/latest-model
    sampling:
      temperature: false
      topP: false
  pricing:
    input_tokens:
      per_mill_tokens: '0.05'
    cached_input_tokens:
      per_mill_tokens: '0.005'
    output_tokens:
      per_mill_tokens: '0.4'
