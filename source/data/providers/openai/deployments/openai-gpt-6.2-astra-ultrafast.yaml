deployments:
  modelId: gpt-6.2-astra
  routeIds: [openai-responses]
  upstream:
    model: gpt-6.2-astra
    serviceTier: ultrafast
  # OpenAI charges 3 times the Standard rate through February 28, 2027 and 6 times from
  # March 1, 2027, Pacific time. Reviewed 2026-11-18: https://developers.openai.com/api/docs/pricing
  periods:
    - name: 'Ultrafast launch price'
      start: 2026-11-18T00:00:00Z
      end: 2027-03-01T08:00:00Z
      set:
        pricing.input_tokens.per_mill_tokens: '24'
        pricing.input_tokens.per_mill_context_gt_272k: '48'
        pricing.cached_input_tokens.per_mill_tokens: '1.2'
        pricing.cached_input_tokens.per_mill_context_gt_272k: '2.4'
        pricing.cache_write_input_tokens.per_mill_tokens: '30'
        pricing.cache_write_input_tokens.per_mill_context_gt_272k: '60'
        pricing.cache_write_12h_input_tokens.per_mill_tokens: '60'
        pricing.cache_write_12h_input_tokens.per_mill_context_gt_272k: '120'
        pricing.output_tokens.per_mill_tokens: '120'
        pricing.output_tokens.per_mill_context_gt_272k: '180'
  pricing:
    input_tokens:
      per_mill_tokens: '48'
      per_mill_context_gt_272k: '96'
    cached_input_tokens:
      per_mill_tokens: '2.4'
      per_mill_context_gt_272k: '4.8'
    cache_write_input_tokens:
      per_mill_tokens: '60'
      per_mill_context_gt_272k: '120'
    cache_write_12h_input_tokens:
      per_mill_tokens: '120'
      per_mill_context_gt_272k: '240'
    output_tokens:
      per_mill_tokens: '240'
      per_mill_context_gt_272k: '360'
