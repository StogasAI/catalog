deployments:
  modelId: gpt-6.1-sol
  routeIds: [openai-chat-completions, openai-responses]
  upstream:
    model: gpt-6.1-sol
    serviceTier: fast
  overrides:
    # OpenAI takes these only at reasoning effort none, which this model lacks. Reviewed
    # 2026-11-15: https://developers.openai.com/api/docs/guides/latest-model
    sampling:
      temperature: false
      topP: false
  pricing:
    input_tokens:
      per_mill_tokens: '4'
      per_mill_context_gt_272k: '8'
    cached_input_tokens:
      per_mill_tokens: '0.2'
      per_mill_context_gt_272k: '0.4'
    cache_write_input_tokens:
      per_mill_tokens: '5'
      per_mill_context_gt_272k: '10'
    output_tokens:
      per_mill_tokens: '20'
      per_mill_context_gt_272k: '30'
