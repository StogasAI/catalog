# OpenAI's data residency endpoint for Europe (eu.api.openai.com), which stores and runs
# requests there. Reviewed 2026-11-16: https://developers.openai.com/api/docs/guides/data-residency
# OpenAI publishes no prices for these endpoints, only the rule that they cost 10% more for models
# released on or after March 5, 2026 (https://developers.openai.com/api/docs/pricing), so these
# are the standard prices with that rule applied.
deployments:
  modelId: gpt-6-astra
  routeIds: [openai-chat-completions, openai-responses]
  upstream:
    model: gpt-6-astra
    inferenceGeo: eu
  stogasByok: false
  notes: OpenAI publishes no prices for its data residency endpoints, so these prices apply its rule of 10% more for models released on or after March 5, 2026.
  pricing:
    input_tokens:
      per_mill_tokens: '11'
      per_mill_context_gt_272k: '22'
    cached_input_tokens:
      per_mill_tokens: '1.1'
      per_mill_context_gt_272k: '2.2'
    cache_write_input_tokens:
      per_mill_tokens: '13.75'
      per_mill_context_gt_272k: '27.5'
    cache_write_12h_input_tokens:
      per_mill_tokens: '27.5'
      per_mill_context_gt_272k: '55'
    output_tokens:
      per_mill_tokens: '55'
      per_mill_context_gt_272k: '82.5'
