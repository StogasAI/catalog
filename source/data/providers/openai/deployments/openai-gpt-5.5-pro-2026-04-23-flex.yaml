deployments:
  modelId: gpt-5.5-pro-2026-04-23
  routeIds: [openai-responses]
  hosting: openai
  upstream:
    model: gpt-5.5-pro-2026-04-23
    serviceTier: flex
  # OpenAI lists no long context price for this tier. Its batch and flex prices are half of the
  # standard ones, which give 30 and 135 for prompts over 272,000 tokens.
  # Reviewed 2026-11-12: https://developers.openai.com/api/docs/pricing
  pricing:
    input_tokens:
      per_mill_tokens: '15'
      per_mill_context_gt_272k: '30'
    output_tokens:
      per_mill_tokens: '90'
      per_mill_context_gt_272k: '135'
