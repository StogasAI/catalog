deployments:
  modelId: gpt-5.5-pro-2026-04-23
  routeIds: [openai-responses]
  upstream:
    model: gpt-5.5-pro-2026-04-23
    serviceTier: flex
  # OpenAI's pricing page lists no long context price for this tier. Its Batch guide gives batch
  # half the synchronous price, and its flex guide prices flex at Batch rates, which gives 30 and
  # 135 for prompts over 272,000 tokens.
  # Reviewed 2026-11-16: https://developers.openai.com/api/docs/pricing,
  # https://developers.openai.com/api/docs/guides/batch
  # and https://developers.openai.com/api/docs/guides/flex-processing
  overrides:
    # OpenAI takes these only at reasoning effort none, which this model lacks. Reviewed
    # 2026-11-15: https://developers.openai.com/api/docs/guides/latest-model
    sampling:
      temperature: false
      topP: false
  pricing:
    input_tokens:
      per_mill_tokens: '15'
      per_mill_context_gt_272k: '30'
    output_tokens:
      per_mill_tokens: '90'
      per_mill_context_gt_272k: '135'
