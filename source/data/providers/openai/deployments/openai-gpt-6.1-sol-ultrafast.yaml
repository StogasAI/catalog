deployments:
  modelId: gpt-6.1-sol
  routeIds: [openai-responses]
  upstream:
    model: gpt-6.1-sol
    serviceTier: ultrafast
  overrides:
    # OpenAI takes these only at reasoning effort none, which this model lacks. Reviewed
    # 2026-11-15: https://developers.openai.com/api/docs/guides/latest-model
    sampling:
      temperature: false
      topP: false
  pricing:
    input_tokens:
      per_mill_tokens: '12'
      per_mill_context_gt_272k: '24'
    cached_input_tokens:
      per_mill_tokens: '0.6'
      per_mill_context_gt_272k: '1.2'
    cache_write_input_tokens:
      per_mill_tokens: '15'
      per_mill_context_gt_272k: '30'
    output_tokens:
      per_mill_tokens: '60'
      per_mill_context_gt_272k: '90'
