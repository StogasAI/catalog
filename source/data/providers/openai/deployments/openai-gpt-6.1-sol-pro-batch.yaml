deployments:
  modelId: gpt-6.1-sol
  routeIds: [openai-batch-responses]
  upstream:
    model: gpt-6.1-sol
    reasoningMode: pro
  overrides:
    # OpenAI takes these only at reasoning effort none, which this model lacks. Reviewed
    # 2026-11-15: https://developers.openai.com/api/docs/guides/latest-model
    sampling:
      temperature: false
      topP: false
  pricing:
    input_tokens:
      per_mill_tokens: '1'
      per_mill_context_gt_272k: '2'
    cached_input_tokens:
      per_mill_tokens: '0.05'
      per_mill_context_gt_272k: '0.1'
    cache_write_input_tokens:
      per_mill_tokens: '1.25'
      per_mill_context_gt_272k: '2.5'
    output_tokens:
      per_mill_tokens: '5'
      per_mill_context_gt_272k: '7.5'
