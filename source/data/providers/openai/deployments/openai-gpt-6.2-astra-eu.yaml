# OpenAI's data residency endpoint for Europe (eu.api.openai.com), which stores and runs
# requests there. Reviewed 2026-11-18: https://developers.openai.com/api/docs/guides/data-residency
# OpenAI publishes no prices for these endpoints, only the rule that they cost 10% more for models
# released on or after March 5, 2026 (https://developers.openai.com/api/docs/pricing), so these
# are the standard prices with that rule applied.
deployments:
  modelId: gpt-6.2-astra
  routeIds: [openai-chat-completions, openai-responses]
  upstream:
    model: gpt-6.2-astra
    inferenceGeo: eu
  stogasByok: false
  notes: OpenAI publishes no prices for its data residency endpoints, so these prices apply its rule of 10% more for models released on or after March 5, 2026.
  overrides:
    # OpenAI takes these only at reasoning effort none, which this model lacks. Reviewed
    # 2026-11-18: https://developers.openai.com/api/docs/guides/reasoning
    sampling:
      temperature: false
      topP: false
  pricing:
    input_tokens:
      per_mill_tokens: '8.8'
      per_mill_context_gt_272k: '17.6'
    cached_input_tokens:
      per_mill_tokens: '0.44'
      per_mill_context_gt_272k: '0.88'
    cache_write_input_tokens:
      per_mill_tokens: '11'
      per_mill_context_gt_272k: '22'
    output_tokens:
      per_mill_tokens: '44'
      per_mill_context_gt_272k: '66'
