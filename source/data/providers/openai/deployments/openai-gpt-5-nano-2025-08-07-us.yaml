# OpenAI's data residency endpoint for the United States (us.api.openai.com), which stores and runs
# requests there. Reviewed 2026-11-16: https://developers.openai.com/api/docs/guides/data-residency
deployments:
  modelId: gpt-5-nano-2025-08-07
  routeIds: [openai-chat-completions, openai-responses]
  upstream:
    model: gpt-5-nano-2025-08-07
    inferenceGeo: us
  stogasByok: false
  # Reviewed 2026-11-13: https://developers.openai.com/api/docs/deprecations
  retirementDate: 2026-12-11
  # OpenAI's model page lists neither image generation nor the hosted shell among the model's
  # tools. Reviewed 2026-11-22: https://developers.openai.com/api/docs/models/gpt-5-nano
  overrides:
    hostedTools:
      shell: false
      image_generation: false
  pricing:
    input_tokens:
      per_mill_tokens: '0.05'
    cached_input_tokens:
      per_mill_tokens: '0.005'
    output_tokens:
      per_mill_tokens: '0.4'
