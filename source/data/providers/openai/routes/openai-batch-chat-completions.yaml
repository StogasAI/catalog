# OpenAI's Batch API runs a file of Chat Completions requests within 24 hours at its Batch
# prices, on the same models and inputs as the Chat Completions route
# (https://developers.openai.com/api/docs/guides/batch). Batch requests cannot stream. OpenAI
# keeps batch input files until they are deleted and output files for 30 days after the batch
# completes, outside zero data retention
# (https://developers.openai.com/api/docs/guides/your-data), so the route states unknown
# retention. Hosted tools stay off until OpenAI prices them for batches.
routes:
  providerId: openai
  endpoint: https://api.openai.com/v1/batches
  interfaces: [chat_completions]
  batch: true
  inputModalities: [text, image, audio]
  capabilities:
    streaming: false
    functionCalling: true
    parallelFunctionCalling: true
    implicitPromptCaching: true
    explicitPromptCaching: true
    structuredOutputs: true
    systemMessages: true
    toolChoice: true
    toolChoiceNone: true
    toolResultImages: false
    toolResultDocuments: false
  # The sampling fields of OpenAI's Chat Completions API. Reviewed 2026-11-15:
  # https://developers.openai.com/api/reference/resources/chat/subresources/completions/methods/create
  sampling:
    temperature: true
    topP: true
    topK: false
    frequencyPenalty: true
    presencePenalty: true
    repetitionPenalty: false
    seed: true
    logitBias: true
  # Native document formats reviewed 2026-10-05: https://developers.openai.com/api/docs/guides/file-inputs
  documentFormats:
    extensions: [.pdf]
    mediaTypes: [application/pdf]
  dataHandling:
    retentionDays: null
