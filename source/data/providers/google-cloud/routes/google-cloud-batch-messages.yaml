# Anthropic's Message Batches API on Claude on Google Cloud (Anthropic managed), at
# https://claude.googleapis.com/v1/projects/{project}/locations/global/workspaces/{workspace}/invoke/v1/messages/batches,
# runs Messages requests at half of every token price, and its results stay available for 29 days,
# as on Anthropic's own API. Batch requests cannot stream. Agent Platform's own batch prediction is
# not listed yet: Google's documentation and its price tables disagree on its endpoints and prices.
# Reviewed 2026-11-05:
# https://platform.claude.com/docs/en/build-with-claude/claude-models-on-google-cloud/anthropic-managed
# https://platform.claude.com/docs/en/about-claude/pricing#batch-processing
routes:
  providerId: google-cloud
  interfaces: [chat_completions, responses]
  inputModalities: [text, image]
  documentFormats:
    extensions: [.csv, .md, .pdf, .txt]
    mediaTypes: [application/pdf, text/plain]
  dataHandling:
    endToEndEncrypted: false
  # Only Anthropic's own offering runs web search and web fetch, at Anthropic's prices, as on its
  # Messages route.
  hostedTools:
    - tool: web_search
      hostings: [anthropic]
      pricing:
        anthropic_web_search_calls:
          per_1k_calls: '10'
      dataHandling:
        processingLocation: unknown
    - tool: web_fetch
      hostings: [anthropic]
      dataHandling:
        processingLocation: unknown
        storageLocation: unknown
        retentionDays: null
        zeroDataRetention: false
  overrides:
    capabilities:
      streaming: false
  stogasUnsupported: The gateway answers each request as it arrives and has no batch API.
