# Claude on Agent Platform, formerly Vertex AI, which Google runs (Google managed):
# https://{host}/v1/projects/{project}/locations/{location}/publishers/anthropic/models/{model}:rawPredict.
# It has no URL sources, Files API, code execution, web fetch, advisor or fallbacks. Its web search is
# off until an organization policy allows it, sends queries to Brave outside Google's residency and
# encryption commitments, and has no verified price, so the catalog lists no hosted tools here.
# Reviewed 2026-10-31: https://platform.claude.com/docs/en/build-with-claude/claude-models-on-google-cloud/google-managed
# and https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/partner-models/claude/web-search
routes:
  providerId: google-cloud
  interfaces: [chat_completions, responses]
  inputModalities: [text, image]
  capabilities:
    streaming: true
    functionCalling: true
    parallelFunctionCalling: true
    implicitPromptCaching: false
    explicitPromptCaching: true
    structuredOutputs: true
    systemMessages: true
    toolChoice: true
    toolResultImages: true
    toolResultDocuments: true
  # The sampling fields of the Messages API, which both of its Claude products take. Reviewed
  # 2026-11-15: https://platform.claude.com/docs/en/api/messages/create
  sampling:
    temperature: true
    topP: true
    topK: true
    frequencyPenalty: false
    presencePenalty: false
    repetitionPenalty: false
    seed: false
    logitBias: false
  # Anthropic states the image limit here as 10 MB of base64 text.
  # Reviewed 2026-11-15: https://platform.claude.com/docs/en/api/overview#request-size-limits,
  # https://platform.claude.com/docs/en/build-with-claude/vision#request-limits and
  # https://platform.claude.com/docs/en/build-with-claude/pdf-support
  inputLimits:
    requestBytes: 30000000
    images:
      count: 600
      bytes: 7500000
      pixels: 8000
    documents:
      pages: 600
  documentFormats:
    extensions: [.csv, .md, .pdf, .txt]
    mediaTypes: [application/pdf, text/plain]
