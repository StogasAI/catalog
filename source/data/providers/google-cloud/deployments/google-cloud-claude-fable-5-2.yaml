# Agent Platform's global endpoint, which routes to any region with capacity.
# Google keeps prompts and responses for up to 30 days to monitor abuse, under its Advanced AI Safety
# Addendum, which each project accepts once in Model Garden. As Anthropic requires, the project also
# shares them with Anthropic to monitor abuse, for each model location it enables.
# Sharing reviewed 2026-11-12: https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/abuse-monitoring
# Vertex AI lists no SKUs for this model, so these prices come from the partner model pricing page,
# reviewed 2026-11-10: https://cloud.google.com/model-garden/partner-models/pricing
# Reviewed 2026-11-10: https://platform.claude.com/docs/en/build-with-claude/claude-models-on-google-cloud/google-managed#global-multi-region-and-regional-endpoints
# and https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/partner-models/claude/fable-5-2
deployments:
  modelId: claude-fable-5-2
  routeIds: [google-cloud-agent-platform-messages]
  upstream:
    model: claude-fable-5-2
    inferenceGeo: global
  overrides:
    dataHandling:
      retentionDays: 30
      sharedWith: [anthropic]
  pricing:
    input_tokens:
      per_mill_tokens: '8'
    cached_input_tokens:
      per_mill_tokens: '0.2'
    cache_write_5m_input_tokens:
      per_mill_tokens: '10'
    cache_write_1h_input_tokens:
      per_mill_tokens: '16'
    output_tokens:
      per_mill_tokens: '40'
