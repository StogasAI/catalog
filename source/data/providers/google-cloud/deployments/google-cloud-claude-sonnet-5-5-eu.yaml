# Agent Platform's eu multi-region endpoint, at Google's 10 percent premium over the global endpoint.
# Prices from Vertex AI's SKUs (service C7E2-9256-1C43).
# Reviewed 2026-11-03: https://cloud.google.com/model-garden/partner-models/pricing
deployments:
  modelId: claude-sonnet-5-5
  routeIds: [google-cloud-agent-platform-messages]
  upstream:
    model: claude-sonnet-5-5
    inferenceGeo: eu
  pricing:
    input_tokens:
      per_mill_tokens: '2.2'
    cached_input_tokens:
      per_mill_tokens: '0.11'
    cache_write_5m_input_tokens:
      per_mill_tokens: '2.75'
    cache_write_1h_input_tokens:
      per_mill_tokens: '4.4'
    output_tokens:
      per_mill_tokens: '11'
