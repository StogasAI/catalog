# Claude Models on Google Cloud (Anthropic managed) rates usage at Anthropic's standard prices,
# and US inference at its multiplier. Reviewed 2026-11-05:
# https://platform.claude.com/docs/en/build-with-claude/claude-models-on-google-cloud/anthropic-managed
# and https://platform.claude.com/docs/en/about-claude/pricing#data-residency-pricing
deployments:
  modelId: claude-haiku-5-5
  routeIds: [google-cloud-messages]
  upstream:
    model: claude-haiku-5-5
    hosting: anthropic
    inferenceGeo: global
  overrides:
    dataHandling:
      storageLocation: US
      retentionDays: 30
  pricing:
    input_tokens:
      per_mill_tokens: '0.1'
      per_mill_context_gt_100k: '0.5'
    cached_input_tokens:
      per_mill_tokens: '0.01'
      per_mill_context_gt_100k: '0.05'
    cache_write_5m_input_tokens:
      per_mill_tokens: '0.125'
      per_mill_context_gt_100k: '0.625'
    cache_write_1h_input_tokens:
      per_mill_tokens: '0.2'
      per_mill_context_gt_100k: '1'
    output_tokens:
      per_mill_tokens: '0.5'
      per_mill_context_gt_100k: '2.5'
