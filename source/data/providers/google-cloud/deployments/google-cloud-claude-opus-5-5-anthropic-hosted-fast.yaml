# Claude Models on Google Cloud (Anthropic managed) offers Fast mode for Claude Opus 5.5 at
# Anthropic's Fast prices. Reviewed 2026-11-07:
# https://platform.claude.com/docs/en/build-with-claude/fast-mode
# and https://platform.claude.com/docs/en/about-claude/pricing#fast-mode-pricing
deployments:
  modelId: claude-opus-5-5
  routeIds: [google-cloud-anthropic-managed-messages]
  hosting: anthropic
  upstream:
    model: claude-opus-5-5
    serviceTier: fast
    inferenceGeo: global
  pricing:
    input_tokens:
      per_mill_tokens: '8'
    cached_input_tokens:
      per_mill_tokens: '0.4'
    cache_write_5m_input_tokens:
      per_mill_tokens: '10'
    cache_write_1h_input_tokens:
      per_mill_tokens: '16'
    output_tokens:
      per_mill_tokens: '40'
