# Claude Models on Google Cloud (Anthropic managed) offers Fast mode for Claude Opus 5.5 at
# Anthropic's Fast prices, and US inference at its multiplier, which applies on top of Fast.
# Reviewed 2026-11-07: https://platform.claude.com/docs/en/build-with-claude/fast-mode
# and https://platform.claude.com/docs/en/about-claude/pricing#fast-mode-pricing
deployments:
  modelId: claude-opus-5-5
  routeIds: [google-cloud-anthropic-managed-messages]
  upstream:
    model: claude-opus-5-5
    serviceTier: fast
    inferenceGeo: us
  pricing:
    input_tokens:
      per_mill_tokens: '8.8'
    cached_input_tokens:
      per_mill_tokens: '0.44'
    cache_write_5m_input_tokens:
      per_mill_tokens: '11'
    cache_write_1h_input_tokens:
      per_mill_tokens: '17.6'
    output_tokens:
      per_mill_tokens: '44'
