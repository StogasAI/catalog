# Agent Platform's eu multi-region endpoint, at Google's 10 percent premium over the global
# endpoint.
# Standard PayGo prices from the Cloud Billing Catalog (Agent Platform, Gemini 3.1 Flash Lite Regional), reviewed
# 2026-11-20: https://cloud.google.com/skus and https://cloud.google.com/model-garden/pricing
# Google charges twice the text price for audio, which the catalog's one input price cannot state,
# so the deployment takes no audio, nor a URL, which can hold audio or video.
deployments:
  modelId: gemini-3.1-flash-lite
  routeIds: [google-cloud-agent-platform-generate-content]
  upstream:
    model: gemini-3.1-flash-lite
    inferenceGeo: eu
  overrides:
    inputModalities: [text, image]
  pricing:
    input_tokens:
      per_mill_tokens: '0.275'
    cached_input_tokens:
      per_mill_tokens: '0.027'
    output_tokens:
      per_mill_tokens: '1.65'
