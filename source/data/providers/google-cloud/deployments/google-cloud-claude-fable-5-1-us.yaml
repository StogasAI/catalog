# Agent Platform's us multi-region endpoint, at Google's 10 percent premium over the global endpoint.
# Google keeps prompts and responses for up to 30 days to monitor abuse, under its Advanced AI Safety
# Addendum, which each project accepts once in Model Garden. As Anthropic requires, the project also
# shares them with Anthropic to monitor abuse, for each model location it enables.
# Sharing reviewed 2026-11-12: https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/abuse-monitoring
# Vertex AI lists no SKUs for this model, so these prices come from the partner model pricing page,
# reviewed 2026-11-03: https://cloud.google.com/model-garden/partner-models/pricing
# Reviewed 2026-10-31: https://platform.claude.com/docs/en/build-with-claude/claude-models-on-google-cloud/google-managed#global-multi-region-and-regional-endpoints
# and https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/partner-models/claude/fable-5-1
deployments:
  modelId: claude-fable-5-1
  routeIds: [google-cloud-agent-platform-messages]
  upstream:
    model: claude-fable-5-1
    inferenceGeo: us
  overrides:
    dataHandling:
      retentionDays: 30
      sharedWith: [anthropic]
  pricing:
    input_tokens:
      per_mill_tokens: '11'
    cached_input_tokens:
      per_mill_tokens: '0.275'
    cache_write_5m_input_tokens:
      per_mill_tokens: '13.75'
    cache_write_1h_input_tokens:
      per_mill_tokens: '22'
    output_tokens:
      per_mill_tokens: '55'
