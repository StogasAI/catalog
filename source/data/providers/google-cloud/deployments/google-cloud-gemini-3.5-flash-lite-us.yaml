# Agent Platform's us multi-region endpoint, at Google's 10 percent premium over the global
# endpoint.
# Standard PayGo prices from the Cloud Billing Catalog (Agent Platform, Gemini 3.5 Flash Lite Regional), reviewed
# 2026-11-20: https://cloud.google.com/skus and https://cloud.google.com/model-garden/pricing
deployments:
  modelId: gemini-3.5-flash-lite
  routeIds: [google-cloud-agent-platform-generate-content]
  upstream:
    model: gemini-3.5-flash-lite
    inferenceGeo: us
  pricing:
    input_tokens:
      per_mill_tokens: '0.33'
    cached_input_tokens:
      per_mill_tokens: '0.033'
    output_tokens:
      per_mill_tokens: '2.75'
