# Agent Platform's eu multi-region endpoint, at Google's 10 percent premium over the global
# endpoint.
# Standard PayGo prices from the Cloud Billing Catalog (Agent Platform, Gemini 3.8 Flash Regional), reviewed
# 2026-11-20: https://cloud.google.com/skus and https://cloud.google.com/model-garden/pricing
deployments:
  modelId: gemini-3.8-flash
  routeIds: [google-cloud-agent-platform-generate-content]
  upstream:
    model: gemini-3.8-flash
    inferenceGeo: eu
  # Google gives half of the net spend back as credits through December 31, 2026, Pacific time.
  periods:
    - name: 'Launch credits'
      start: 2026-11-20T00:00:00Z
      end: 2027-01-01T08:00:00Z
      set:
        pricing.input_tokens.per_mill_tokens: '0.825'
        pricing.cached_input_tokens.per_mill_tokens: '0.0825'
        pricing.output_tokens.per_mill_tokens: '4.125'
  pricing:
    input_tokens:
      per_mill_tokens: '1.65'
    cached_input_tokens:
      per_mill_tokens: '0.165'
    output_tokens:
      per_mill_tokens: '8.25'
