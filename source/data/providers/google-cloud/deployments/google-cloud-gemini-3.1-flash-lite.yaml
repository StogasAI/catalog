# Agent Platform's global endpoint, which routes to any region with capacity.
# Standard PayGo prices from the Cloud Billing Catalog (Agent Platform, Gemini 3.1 Flash Lite Global), reviewed
# 2026-11-20: https://cloud.google.com/skus and https://cloud.google.com/model-garden/pricing
# The catalog has no audio input price, and Google charges twice the text price for audio.
deployments:
  modelId: gemini-3.1-flash-lite
  routeIds: [google-cloud-agent-platform-generate-content]
  upstream:
    model: gemini-3.1-flash-lite
    inferenceGeo: global
  overrides:
    inputModalities: [text, image]
  pricing:
    input_tokens:
      per_mill_tokens: '0.25'
    cached_input_tokens:
      per_mill_tokens: '0.025'
    output_tokens:
      per_mill_tokens: '1.5'
