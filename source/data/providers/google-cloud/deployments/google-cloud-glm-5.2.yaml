# Google runs GLM-5.2 as a preview at the global endpoint only, and the model's server takes a
# max_tokens up to the context window of 1,048,576 tokens, as the model's record states (capture
# google-cloud/chat-completions-limits).
# Prices from the Cloud Billing Catalog (Vertex AI, Model as a Service GLM-5.2 Input Token, Cached
# Text Input Token and Output Token), reviewed 2026-11-22: https://cloud.google.com/skus
# Launch stage, modalities and features reviewed 2026-11-22:
# https://docs.cloud.google.com/gemini-enterprise-agent-platform/resources/locations#genai-open-models
# and https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/maas/zaiorg/glm-52
deployments:
  modelId: glm-5.2
  routeIds: [google-cloud-agent-platform-chat-completions]
  upstream:
    model: zai-org/glm-5.2-maas
    inferenceGeo: global
  overrides:
    # The model ignored tool_choice required or naming a function in some answers and wrote text
    # until the output limit (capture google-cloud/chat-completions-fields).
    capabilities:
      toolChoice: false
    # The model reasons at max without an effort and at every effort but high (capture
    # google-cloud/chat-completions-reasoning).
    reasoningDefault: max
    # Google documents a minimum of 4,096 tokens, but caches the prompt in blocks of 64 tokens from
    # the first block on (capture google-cloud/chat-completions-caching).
    promptCacheMinimumTokens: 64
  pricing:
    input_tokens:
      per_mill_tokens: '1.4'
    cached_input_tokens:
      per_mill_tokens: '0.14'
    output_tokens:
      per_mill_tokens: '4.4'
