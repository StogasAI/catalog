# Agent Platform's global endpoint, which routes to any region with capacity.
# Standard PayGo prices from the Cloud Billing Catalog (Agent Platform, Gemini 4 Carbon Global), reviewed
# 2026-11-20: https://cloud.google.com/skus and https://cloud.google.com/model-garden/pricing
# Google serves the model to verified enterprise customers in select regions.
deployments:
  modelId: gemini-4-carbon
  routeIds: [google-cloud-agent-platform-generate-content]
  upstream:
    model: gemini-4-carbon
    inferenceGeo: global
  approvalRequired: true
  overrides:
    # One generateContent reply on v1 is one foreground segment of at most 65,536 tokens, and
    # 32,768 without streaming. Reviewed 2026-11-20: https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/gemini/4-carbon
    maxOutputTokens: 65536
  # Google bills the full price and gives half of the net spend back later as credits, through
  # November 30, 2026, Pacific time, so the deployment states the price that Google bills.
  pricing:
    input_tokens:
      per_mill_tokens: '4'
    cached_input_tokens:
      per_mill_tokens: '0.2'
    output_tokens:
      per_mill_tokens: '20'
