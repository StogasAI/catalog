# Agent Platform's global endpoint, which routes to any region with capacity.
# Standard PayGo prices from the Cloud Billing Catalog (Agent Platform, Gemini 3.8 Flash Global), reviewed
# 2026-11-20: https://cloud.google.com/skus and https://cloud.google.com/model-garden/pricing
deployments:
  modelId: gemini-3.8-flash
  routeIds: [google-cloud-agent-platform-generate-content]
  upstream:
    model: gemini-3.8-flash
    inferenceGeo: global
  # Google gives half of the net spend back as credits through December 31, 2026, Pacific time.
  periods:
    - name: 'Launch credits'
      start: 2026-11-20T00:00:00Z
      end: 2027-01-01T08:00:00Z
      set:
        pricing.input_tokens.per_mill_tokens: '0.75'
        pricing.cached_input_tokens.per_mill_tokens: '0.075'
        pricing.output_tokens.per_mill_tokens: '3.75'
  pricing:
    input_tokens:
      per_mill_tokens: '1.5'
    cached_input_tokens:
      per_mill_tokens: '0.15'
    output_tokens:
      per_mill_tokens: '7.5'
