# Agent Platform's global endpoint, which routes to any region with capacity.
# Google prices this model on no multi-region, only on the global endpoint and single regions,
# which the gateway does not call.
# Vertex AI lists no SKUs for this model, so these prices come from the partner model pricing page.
# That page lists no one-hour cache write price, and Google's Claude prompt caching page prices one
# at twice the base input price.
# Reviewed 2026-11-03: https://cloud.google.com/model-garden/partner-models/pricing
# Reviewed 2026-11-16: https://docs.cloud.google.com/vertex-ai/generative-ai/docs/partner-models/claude/prompt-caching
deployments:
  modelId: claude-opus-4-5
  routeIds: [google-cloud-agent-platform-messages]
  upstream:
    model: claude-opus-4-5
    inferenceGeo: global
  pricing:
    input_tokens:
      per_mill_tokens: '5'
    cached_input_tokens:
      per_mill_tokens: '0.5'
    cache_write_5m_input_tokens:
      per_mill_tokens: '6.25'
    cache_write_1h_input_tokens:
      per_mill_tokens: '10'
    output_tokens:
      per_mill_tokens: '25'
