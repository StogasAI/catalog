# Anthropic's Message Batches API on Claude Models on Google Cloud (Anthropic managed), at
# Anthropic's batch prices. Reviewed 2026-11-05:
# https://platform.claude.com/docs/en/build-with-claude/claude-models-on-google-cloud/anthropic-managed
# and https://platform.claude.com/docs/en/about-claude/pricing#batch-processing
deployments:
  modelId: claude-sonnet-4-6
  routeIds: [google-cloud-anthropic-managed-message-batches]
  hosting: anthropic
  upstream:
    model: claude-sonnet-4-6
    inferenceGeo: us
  overrides:
    dataHandling:
      processingLocation: US
  pricing:
    input_tokens:
      per_mill_tokens: '1.65'
    cached_input_tokens:
      per_mill_tokens: '0.165'
    cache_write_5m_input_tokens:
      per_mill_tokens: '2.0625'
    cache_write_1h_input_tokens:
      per_mill_tokens: '3.3'
    output_tokens:
      per_mill_tokens: '8.25'
