# Agent Platform's global endpoint, which routes to any region with capacity.
# Vertex AI lists no SKUs for this model, so these prices come from the partner model pricing page.
# Reviewed 2026-11-03: https://cloud.google.com/model-garden/partner-models/pricing
deployments:
  modelId: claude-haiku-5-5
  routeIds: [google-cloud-agent-platform-messages]
  upstream:
    model: claude-haiku-5-5
    inferenceGeo: global
  pricing:
    input_tokens:
      per_mill_tokens: '0.1'
      per_mill_context_gt_100k: '0.5'
    cached_input_tokens:
      per_mill_tokens: '0.01'
      per_mill_context_gt_100k: '0.05'
    cache_write_5m_input_tokens:
      per_mill_tokens: '0.125'
      per_mill_context_gt_100k: '0.625'
    cache_write_1h_input_tokens:
      per_mill_tokens: '0.2'
      per_mill_context_gt_100k: '1'
    output_tokens:
      per_mill_tokens: '0.5'
      per_mill_context_gt_100k: '2.5'
