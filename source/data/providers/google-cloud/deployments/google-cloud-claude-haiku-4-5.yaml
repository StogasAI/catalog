# Agent Platform's global endpoint, which routes to any region with capacity.
# Google prices this model on no multi-region, only on the global endpoint and single regions,
# which the gateway does not call.
# Vertex AI lists no SKUs for this model, so these prices come from the partner model pricing page.
# Reviewed 2026-11-03: https://cloud.google.com/model-garden/partner-models/pricing
deployments:
  modelId: claude-haiku-4-5
  routeIds: [google-cloud-messages]
  upstream:
    model: claude-haiku-4-5
    hosting: google-cloud
    inferenceGeo: global
  pricing:
    input_tokens:
      per_mill_tokens: '1'
    cached_input_tokens:
      per_mill_tokens: '0.1'
    cache_write_5m_input_tokens:
      per_mill_tokens: '1.25'
    cache_write_1h_input_tokens:
      per_mill_tokens: '2'
    output_tokens:
      per_mill_tokens: '5'
