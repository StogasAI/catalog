providers:
  name: Google Cloud
  aliases: [gcp]
  stogasByok: true
  companyId: google
  # Claude Models on Google Cloud (Anthropic managed) follows the retention of Anthropic's own
  # API, and Anthropic enables zero data retention for an organization on request. Google's API
  # does not report it. Reviewed 2026-11-19:
  # https://platform.claude.com/docs/en/manage-claude/api-and-data-retention#what-zdr-covers
  accountOptions:
    - id: zero-data-retention
      name: Anthropic zero data retention
      routes: [google-cloud-anthropic-managed-messages]
      dataHandling:
        storageLocation: none
        retentionDays: 0
        zeroDataRetention: true
  # Request-response logging is a project setting that no request can turn off, so retention is unknown.
  # Reviewed 2026-10-31: https://cloud.google.com/vertex-ai/generative-ai/docs/vertex-ai-zero-data-retention
  # Google Cloud names generative AI on Agent Platform in the scope of each audit below, and says
  # that these certifications still apply when a partner model runs as a managed API. Its HIPAA
  # page names no partner model, and its FedRAMP High boundary covers United States regions only.
  # Certifications reviewed 2026-11-17: https://cloud.google.com/security/compliance/services-in-scope
  # and https://docs.cloud.google.com/vertex-ai/generative-ai/docs/partner-models/use-partner-models
  dataHandling:
    processingLocation: world
    storageLocation: unknown
    retentionDays: null
    trainingUse: false
    # Organizations never share Claude's prompt caches, on Google Cloud too, and Google never serves
    # Gemini's cache of one project to another. Reviewed 2026-11-19:
    # https://platform.claude.com/docs/en/build-with-claude/prompt-caching and 2026-11-20:
    # https://docs.cloud.google.com/gemini-enterprise-agent-platform/resources/zero-data-retention
    isolatedPromptCache: true
    certifications:
      - soc2-type2
      - iso-27001
      - iso-27017
      - iso-27018
      - iso-27701
      - iso-42001
      - pci-dss
      - csa-star-level-2
