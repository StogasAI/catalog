models:
  authorId: openai
  name: GPT-6.1 Sol
  groupIds: [gpt-6.1, gpt-6-sol]
  contextWindowTokens: 1050000
  maxInputTokens: 922000
  maxOutputTokens: 128000
  inputModalities: [text, image]
  outputModalities: [text]
  reasoning: required
  reasoningEfforts: [low, medium, high, xhigh, max]
  reasoningEffortsByInterface:
    chat_completions: [low, medium, high, xhigh]
  # Reviewed 2026-11-15: https://developers.openai.com/api/docs/guides/reasoning
  reasoningDefault: medium
  openWeights: false
  # OpenAI takes these only at reasoning effort none, which this model lacks, on Azure too.
  # Reviewed 2026-11-18: https://developers.openai.com/api/docs/guides/latest-model
  sampling:
    temperature: false
    topP: false
  # Reviewed 2026-11-15: https://developers.openai.com/api/docs/guides/prompt-caching
  promptCacheMinimumTokens: 1024
  releaseDate: 2026-09-29
  succeeds: gpt-6-sol
  knowledgeCutoff: 2026-04-30
