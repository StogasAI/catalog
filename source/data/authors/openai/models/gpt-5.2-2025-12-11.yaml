models:
  authorId: openai
  name: GPT-5.2
  aliases: [gpt-5.2]
  groupIds: [gpt-5.2]
  contextWindowTokens: 400000
  # OpenAI's page states no input limit. Microsoft states 272,000 for this version, and every OpenAI
  # page that states one gives the window less the 128,000 output tokens.
  maxInputTokens: 272000
  maxOutputTokens: 128000
  inputModalities: [text, image]
  outputModalities: [text]
  capabilities:
    explicitPromptCaching: false
  reasoning: optional
  reasoningEfforts: [low, medium, high, xhigh]
  openWeights: false
  snapshot: 2025-12-11
  releaseDate: 2025-12-11
  knowledgeCutoff: 2025-08-31
