models:
  authorId: openai
  name: GPT-5.5
  aliases: [gpt-5.5]
  groupIds: [gpt-5.5]
  contextWindowTokens: 1050000
  # OpenAI's page states no input limit. Microsoft states 922,000 for this version, and every OpenAI
  # page that states one gives the window less the 128,000 output tokens.
  maxInputTokens: 922000
  maxOutputTokens: 128000
  inputModalities: [text, image]
  outputModalities: [text]
  capabilities:
    explicitPromptCaching: false
  reasoning: optional
  reasoningEfforts: [low, medium, high, xhigh]
  # Reviewed 2026-11-15: https://developers.openai.com/api/docs/guides/reasoning
  reasoningDefault: medium
  openWeights: false
  snapshot: 2026-04-23
  releaseDate: 2026-04-24
  succeeds: gpt-5.4-2026-03-05
  knowledgeCutoff: 2025-12-01
