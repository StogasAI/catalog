models:
  authorId: openai
  name: GPT-5.4 Pro
  aliases: [gpt-5.4-pro]
  groupIds: [gpt-5.4]
  contextWindowTokens: 1050000
  # OpenAI's page states no input limit. Microsoft states 922,000 for this version, and every OpenAI
  # page that states one gives the window less the 128,000 output tokens.
  maxInputTokens: 922000
  maxOutputTokens: 128000
  inputModalities: [text, image]
  outputModalities: [text]
  capabilities:
    implicitPromptCaching: false
    explicitPromptCaching: false
    structuredOutputs: false
  reasoning: required
  reasoningEfforts: [medium, high, xhigh]
  openWeights: false
  snapshot: 2026-03-05
  releaseDate: 2026-03-05
  knowledgeCutoff: 2025-08-31
