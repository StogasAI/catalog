models:
  authorId: anthropic
  name: Claude Opus 4.1
  aliases: [claude-opus-4-1-20250805, claude-4.1-opus]
  groupIds: [claude-opus-4]
  contextWindowTokens: 200000
  maxOutputTokens: 32000
  inputModalities: [text, image]
  outputModalities: [text]
  reasoning: optional
  reasoningMaxTokens:
    minimum: 1024
    maximum: 31999
  # Reviewed 2026-11-15: https://platform.claude.com/docs/en/build-with-claude/thinking-troubleshooting
  reasoningDefault: none
  openWeights: false
  # Reviewed 2026-11-15: https://platform.claude.com/docs/en/build-with-claude/prompt-caching
  promptCacheMinimumTokens: 1024
  # Anthropic allows 100 images and 100 PDF pages for a model with a 200,000-token window.
  # Reviewed 2026-11-15: https://platform.claude.com/docs/en/build-with-claude/vision#request-limits
  inputLimits:
    images:
      count: 100
    documents:
      pages: 100
  snapshot: 2025-08-05
  releaseDate: 2025-08-05
  knowledgeCutoff: 2025-03-01
