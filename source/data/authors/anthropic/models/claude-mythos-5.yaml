models:
  authorId: anthropic
  name: Claude Mythos 5
  aliases: [claude-5-mythos]
  groupIds: [claude-mythos-5]
  contextWindowTokens: 1000000
  maxOutputTokens: 128000
  inputModalities: [text, image]
  outputModalities: [text]
  reasoning: required
  reasoningEfforts: [low, medium, high, xhigh, max]
  # Reviewed 2026-11-15: https://platform.claude.com/docs/en/build-with-claude/thinking-troubleshooting
  # and https://platform.claude.com/docs/en/build-with-claude/effort
  reasoningDefault: high
  openWeights: false
  # Any value but the default returns 400. Reviewed 2026-11-15:
  # https://platform.claude.com/docs/en/build-with-claude/thinking
  sampling:
    temperature: false
    topP: false
    topK: false
  # Reviewed 2026-11-15: https://platform.claude.com/docs/en/build-with-claude/prompt-caching
  promptCacheMinimumTokens: 512
  # Anthropic requires 30 days of retention wherever a Covered Model runs, so zero data retention
  # does not reach it. Reviewed 2026-11-19:
  # https://platform.claude.com/docs/en/manage-claude/api-and-data-retention#model-specific-data-retention-requirements
  minimumRetentionDays: 30
  releaseDate: 2026-06-09
  knowledgeCutoff: 2026-01-01
