models:
  authorId: google
  name: Gemini 3.5 Flash-Lite
  groupIds: [gemini-3-flash-lite]
  contextWindowTokens: 1048576
  maxOutputTokens: 65536
  inputModalities: [text, image, audio, video]
  outputModalities: [text]
  # Thinking cannot be turned off. Reviewed 2026-11-20: https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/gemini/3-5-flash-lite
