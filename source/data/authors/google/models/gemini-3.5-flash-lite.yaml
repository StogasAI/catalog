  openWeights: false
  # Google ignores custom temperature, top_p and top_k and refuses penalties
  # (capture google-cloud/generate-content-request-fields).
  sampling:
    temperature: false
    topP: false
    topK: false
    frequencyPenalty: false
    presencePenalty: false
