name: Release catalog

on:
  workflow_dispatch:
    inputs:
      sequence:
        description: Monotonically increasing catalog sequence
        required: true
        type: string
      channel:
        description: Release channel
        required: true
        default: canary
        type: choice
        options: [canary, stable]
      min_gateway_version:
        description: Minimum compatible gateway version
        required: true
        type: string

concurrency:
  group: catalog-release-${{ inputs.channel }}
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    environment: catalog-${{ inputs.channel }}
    runs-on: ubuntu-24.04
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.3
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Reject reused or decreasing sequences
        env:
          GH_TOKEN: ${{ github.token }}
          SEQUENCE: ${{ inputs.sequence }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SEQUENCE" =~ ^[1-9][0-9]*$ ]]
          latest="$(
            gh release list --limit 100 --json tagName --jq \
              '[.[].tagName | select(startswith("catalog-v")) | ltrimstr("catalog-v") | tonumber] | max // 0'
          )"
          test "$SEQUENCE" -gt "$latest"
      - name: Build signed release
        env:
          CATALOG_MIN_GATEWAY_VERSION: ${{ inputs.min_gateway_version }}
          CATALOG_SIGNING_KEY_ID: ${{ secrets.CATALOG_SIGNING_KEY_ID }}
          CATALOG_SIGNING_PRIVATE_KEY_PEM: ${{ secrets.CATALOG_SIGNING_PRIVATE_KEY_PEM }}
          CATALOG_SOURCE_COMMIT: ${{ github.sha }}
          SEQUENCE: ${{ inputs.sequence }}
        shell: bash
        run: |
          set -euo pipefail
          export CATALOG_SOURCE_TIMESTAMP
          CATALOG_SOURCE_TIMESTAMP="$(git show -s --format=%cI "$GITHUB_SHA")"
          node source/scripts/create-release.mjs "$SEQUENCE"
          (cd release && sha256sum --check SHA256SUMS)
      - name: Attest release files
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32
        with:
          subject-path: |
            release/releases/*.json
            release/blobs/sha256/*.json
      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          SEQUENCE: ${{ inputs.sequence }}
        shell: bash
        run: |
          set -euo pipefail
          tag="catalog-v$SEQUENCE"
          test -z "$(git tag --list "$tag")"
          gh release create "$tag" \
            release/releases/"$SEQUENCE".json \
            release/blobs/sha256/*.json \
            release/SHA256SUMS \
            --target "$GITHUB_SHA" \
            --title "Catalog $SEQUENCE" \
            --generate-notes
      - name: Publish immutable blobs and activate channel
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          CHANNEL: ${{ inputs.channel }}
          SEQUENCE: ${{ inputs.sequence }}
        shell: bash
        run: |
          set -euo pipefail
          for file in release/blobs/sha256/*.json release/releases/"$SEQUENCE".json; do
            key="${file#release/}"
            if aws s3api head-object --bucket "$R2_BUCKET" --key "$key" --endpoint-url "$R2_ENDPOINT" >/dev/null 2>&1; then
              echo "Refusing to overwrite immutable object $key" >&2
              exit 1
            fi
            aws s3 cp "$file" "s3://$R2_BUCKET/$key" \
              --endpoint-url "$R2_ENDPOINT" \
              --cache-control "public,max-age=31536000,immutable" \
              --content-type application/json
          done
          aws s3 cp release/channel.json "s3://$R2_BUCKET/channels/$CHANNEL.json" \
            --endpoint-url "$R2_ENDPOINT" \
            --cache-control "no-cache" \
            --content-type application/json
