name: Propose catalog release

on:
  workflow_dispatch:
    inputs:
      sequence:
        description: Monotonically increasing catalog sequence
        required: true
        type: string
      channel:
        description: Release channel
        required: true
        default: canary
        type: choice
        options: [canary, stable]
      min_gateway_version:
        description: Minimum compatible gateway version
        required: true
        type: string

concurrency:
  group: catalog-release
  cancel-in-progress: false

permissions: {}

jobs:
  propose:
    environment: catalog-${{ inputs.channel }}
    runs-on: ubuntu-24.04
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.3
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Reject reused or decreasing sequences
        env:
          GH_TOKEN: ${{ github.token }}
          SEQUENCE: ${{ inputs.sequence }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SEQUENCE" =~ ^[1-9][0-9]*$ ]]
          latest="$(
            gh release list --limit 100 --json tagName --jq \
              '[.[].tagName | select(startswith("catalog-v")) | ltrimstr("catalog-v") | tonumber] | max // 0'
          )"
          test "$SEQUENCE" -gt "$latest"
      - name: Build release draft
        env:
          CATALOG_CHANNEL: ${{ inputs.channel }}
          CATALOG_DRAFT_CREATED_AT: ${{ github.event.repository.updated_at }}
          CATALOG_MIN_GATEWAY_VERSION: ${{ inputs.min_gateway_version }}
          CATALOG_SOURCE_COMMIT: ${{ github.sha }}
          SEQUENCE: ${{ inputs.sequence }}
        shell: bash
        run: |
          set -euo pipefail
          export CATALOG_DRAFT_CREATED_AT
          CATALOG_DRAFT_CREATED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          node source/scripts/create-draft.mjs "$SEQUENCE"
      - name: Attest draft files
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32
        with:
          subject-path: draft/*.json
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          SEQUENCE: ${{ inputs.sequence }}
        shell: bash
        run: |
          set -euo pipefail
          tag="catalog-v$SEQUENCE"
          test -z "$(git tag --list "$tag")"
          gh release create "$tag" \
            draft/catalog.draft.json \
            draft/catalog.runtime.json \
            draft/catalog.public.json \
            --draft \
            --target "$GITHUB_SHA" \
            --title "Catalog $SEQUENCE draft" \
            --notes "Attested release candidate. Publication requires independent local verification and Stogas signing."
