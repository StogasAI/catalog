name: Catalog Release

on:
  push:
    tags:
      - 'catalog-v*'

concurrency:
  group: catalog-release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

# A release builds only from its tag, never from a cache that another run wrote.
cache-mode: none

jobs:
  # A release is attested and drafted only for a commit that passes CI, which runs beside the
  # build. The workflow runs CI itself, because a newer push to main can cancel main's run of the
  # tagged commit.
  ci:
    name: CI
    uses: $/.github/workflows/ci.yml

  build:
    name: Build Catalog
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Validate tag
        run: '[[ "$GITHUB_REF" =~ ^refs/tags/catalog-v[1-9][0-9]*$ ]]'

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.22.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4

      - name: Build catalog
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          bun install --frozen-lockfile
          node source/scripts/create-proposal.mjs "${GITHUB_REF_NAME#catalog-v}" "dist/catalog/$GITHUB_REF_NAME"
          cd "dist/catalog/$GITHUB_REF_NAME"
          sha256sum -c SHA256SUMS

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: catalog-release-${{ github.ref_name }}
          path: dist/catalog/${{ github.ref_name }}
          if-no-files-found: error
          retention-days: 7

  # The job that signs the build proof runs no code from the repository or its packages.
  publish:
    name: Publish Draft Release
    runs-on: ubuntu-24.04
    needs: [ci, build]
    timeout-minutes: 10
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: catalog-release-${{ github.ref_name }}
          path: dist/catalog/${{ github.ref_name }}

      - name: Check the built files
        working-directory: dist/catalog/${{ github.ref_name }}
        run: |
          set -euo pipefail
          sha256sum -c SHA256SUMS
          sha256sum catalog-release.json catalog.json > "$RUNNER_TEMP/attested"

      - name: Generate GitHub artifact attestation
        id: attest
        uses: actions/attest@c32b4b8b198b65d0bd9d63490e847ff7b53989d4
        with:
          create-storage-record: false
          subject-checksums: ${{ runner.temp }}/attested

      - name: Collect GitHub attestation
        working-directory: dist/catalog/${{ github.ref_name }}
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp "$BUNDLE_PATH" github-attestation.jsonl
          sha256sum github-attestation.jsonl >> SHA256SUMS
          sha256sum -c SHA256SUMS

      # The draft names no target commit, because GitHub refuses the workflow token a release
      # whose target has workflow files that no branch has, as once main changes a workflow
      # during the build. The existing tag still decides the commit.
      - name: Create or replace draft release
        working-directory: dist/catalog/${{ github.ref_name }}
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          assets=(catalog.json catalog-release.json github-attestation.jsonl SHA256SUMS)
          if gh release view "$tag" >/dev/null 2>&1; then
            test "$(gh release view "$tag" --json isDraft --jq '.isDraft')" = "true" || {
              echo "Catalog release $tag is final and cannot be changed." >&2
              exit 1
            }
            # A run that builds the tag again replaces every file of its earlier draft.
            gh release view "$tag" --json assets --jq '.assets[].name' |
              while IFS= read -r asset; do
                gh release delete-asset "$tag" "$asset" --yes
              done
            gh release upload "$tag" "${assets[@]}"
          else
            gh release create "$tag" "${assets[@]}" --draft --verify-tag --title "Catalog ${tag#catalog-v}"
          fi
